          package com.mushka.colortap;

          import org.json.JSONArray;
          import org.json.JSONException;
          import org.json.JSONObject;

          import java.util.ArrayList;
          import java.util.List;

          public class Rule {
              public String name = "Новое правило";
              public int color = 0xFFFF3333;
              public int tolerance = 25;
              public boolean enabled = true;
              public int rl = -1, rt = -1, rr = -1, rb = -1;
              public String repeat = "wait_gone";
              public int repeatDelay = 500;
              public List<Step> steps = new ArrayList<>();

              public boolean hasRegion() {
                  return rr > rl && rb > rt && rl >= 0;
              }

              public JSONObject toJson() throws JSONException {
                  JSONObject o = new JSONObject();
                  o.put("name", name);
                  o.put("color", color);
                  o.put("tolerance", tolerance);
                  o.put("enabled", enabled);
                  o.put("rl", rl);
                  o.put("rt", rt);
                  o.put("rr", rr);
                  o.put("rb", rb);
                  o.put("repeat", repeat);
                  o.put("repeatDelay", repeatDelay);
                  JSONArray a = new JSONArray();
                  for (Step s : steps) a.put(s.toJson());
                  o.put("steps", a);
                  return o;
              }

              public static Rule fromJson(JSONObject o) throws JSONException {
                  Rule r = new Rule();
                  r.name = o.optString("name", "Правило");
                  r.color = o.optInt("color", 0xFFFF3333);
                  r.tolerance = o.optInt("tolerance", 25);
                  r.enabled = o.optBoolean("enabled", true);
                  r.rl = o.optInt("rl", -1);
                  r.rt = o.optInt("rt", -1);
                  r.rr = o.optInt("rr", -1);
                  r.rb = o.optInt("rb", -1);
                  r.repeat = o.optString("repeat", "wait_gone");
                  r.repeatDelay = o.optInt("repeatDelay", 500);
                  JSONArray a = o.optJSONArray("steps");
                  if (a != null) {
                      for (int i = 0; i < a.length(); i++) {
                          r.steps.add(Step.fromJson(a.getJSONObject(i)));
                      }
                  }
                  return r;
              }
          }
