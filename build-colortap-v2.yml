          package com.mushka.colortap;

          import android.content.Context;
          import android.content.SharedPreferences;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.util.ArrayList;
          import java.util.List;

          public class RuleManager {
              private static final String KEY = "rules_v2";
              private final SharedPreferences prefs;

              public RuleManager(Context c) {
                  prefs = c.getSharedPreferences("c", Context.MODE_PRIVATE);
              }

              public List<Rule> load() {
                  List<Rule> list = new ArrayList<>();
                  String s = prefs.getString(KEY, "");
                  if (s == null || s.isEmpty()) {
                      Rule r = new Rule();
                      r.name = "Пример";
                                r.enabled = false;
                      Step st = new Step();
                      st.x = 500;
                      st.y = 1200;
                      st.delay = 800;
                      r.steps.add(st);
                      list.add(r);
                      return list;
                  }
                  try {
                      JSONArray a = new JSONArray(s);
                      for (int i = 0; i < a.length(); i++) {
                          list.add(Rule.fromJson(a.getJSONObject(i)));
                      }
                  } catch (Exception ignored) {
                  }
                  return list;
              }

              public void save(List<Rule> list) {
                  try {
                      JSONArray a = new JSONArray();
                      for (Rule r : list) a.put(r.toJson());
                      prefs.edit().putString(KEY, a.toString()).apply();
                  } catch (Exception ignored) {
                  }
              }

              public List<String> profileNames() {
                  List<String> out = new ArrayList<>();
                  try {
                      JSONObject root = new JSONObject(prefs.getString("profiles", "{}"));
                      JSONArray names = root.names();
                      if (names != null) {
                          for (int i = 0; i < names.length(); i++) out.add(names.getString(i));
                      }
                  } catch (Exception ignored) {
                  }
                  return out;
              }

              public void saveProfile(String name, List<Rule> rules) {
                  try {
                      JSONObject root = new JSONObject(prefs.getString("profiles", "{}"));
                      JSONArray a = new JSONArray();
                      for (Rule r : rules) a.put(r.toJson());
                      root.put(name, a);
                      prefs.edit().putString("profiles", root.toString()).apply();
                  } catch (Exception ignored) {
                  }
              }

              public List<Rule> loadProfile(String name) {
                  List<Rule> out = new ArrayList<>();
                  try {
                      JSONObject root = new JSONObject(prefs.getString("profiles", "{}"));
                      JSONArray a = root.optJSONArray(name);
                      if (a != null) {
                          for (int i = 0; i < a.length(); i++) {
                              out.add(Rule.fromJson(a.getJSONObject(i)));
                          }
                      }
                  } catch (Exception ignored) {
                  }
                  return out;
              }

              public void deleteProfile(String name) {
                  try {
                      JSONObject root = new JSONObject(prefs.getString("profiles", "{}"));
                      root.remove(name);
                      prefs.edit().putString("profiles", root.toString()).apply();
                  } catch (Exception ignored) {
                  }
              }

              public String exportAll() {
                  try {
                      JSONObject root = new JSONObject();
                      JSONArray a = new JSONArray();
                      for (Rule r : load()) a.put(r.toJson());
                      root.put("rules", a);
                      root.put("profiles", new JSONObject(prefs.getString("profiles", "{}")));
                      return root.toString();
                  } catch (Exception e) {
                      return "{}";
                  }
              }

              public void importAll(String json) {
                  try {
                      JSONObject root = new JSONObject(json);
                      JSONArray a = root.optJSONArray("rules");
                      if (a != null) {
                          List<Rule> list = new ArrayList<>();
                          for (int i = 0; i < a.length(); i++) list.add(Rule.fromJson(a.getJSONObject(i)));
                          save(list);
                      }
                      JSONObject p = root.optJSONObject("profiles");
                      if (p != null) prefs.edit().putString("profiles", p.toString()).apply();
                  } catch (Exception ignored) {
                  }
              }

              public void clearAll() {
                  prefs.edit().remove(KEY).remove("profiles").apply();
              }
          }
          FILE_9_END
