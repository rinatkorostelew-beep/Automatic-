          package com.mushka.colortap;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.text.InputType;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.List;

          public class RuleEditActivity extends Activity {
              private static final String[] MODES = {"wait_gone", "interval", "once"};
              private static final String[] MODE_NAMES = {
                      "ждать, пока цвет исчезнет",
                      "повторять каждые N мс, пока цвет виден",
                      "сработать один раз"};

              private RuleManager rm;
              private SharedPreferences prefs;
              private List<Rule> rules;
              private Rule rule;
              private int idx;
              private LinearLayout stepsBox;
              private TextView tolLabel;
              private TextView regionLabel;
              private EditText nameEt;
              private EditText delayEt;
              private Button colorBtn;
              private Button repeatBtn;
              private SeekBar tolBar;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  rm = new RuleManager(this);
                  prefs = getSharedPreferences("c", MODE_PRIVATE);
                  rules = rm.load();
                  idx = getIntent().getIntExtra("idx", 0);
                  if (idx < 0 || idx >= rules.size()) {
                      finish();
                      return;
                  }
                  rule = rules.get(idx);

                  ScrollView sv = new ScrollView(this);
                  sv.setBackgroundColor(Color.parseColor("#0E1020"));
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  int pad = dp(16);
                  root.setPadding(pad, pad, pad, pad);
                  sv.addView(root);

                  TextView title = new TextView(this);
                  title.setText("Настройка правила");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(22);
                  root.addView(title);

                  nameEt = new EditText(this);
                  nameEt.setText(rule.name);
                  nameEt.setTextColor(Color.WHITE);
                  nameEt.setHint("Имя правила");
                  nameEt.setHintTextColor(0xFF777777);
                  nameEt.setInputType(InputType.TYPE_CLASS_TEXT);
                  root.addView(nameEt);

                  colorBtn = new Button(this);
                  colorBtn.setOnClickListener(v -> pickColor());
                  root.addView(colorBtn);

                  tolLabel = new TextView(this);
                  tolLabel.setTextColor(Color.WHITE);
                  tolLabel.setTextSize(14);
                  root.addView(tolLabel);

                  tolBar = new SeekBar(this);
                  tolBar.setMax(80);
                  tolBar.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override
                      public void onProgressChanged(SeekBar s, int p, boolean f) {
                          rule.tolerance = p;
                          tolLabel.setText("Допуск цвета: " + p);
                      }

                      @Override
                      public void onStartTrackingTouch(SeekBar s) {
                      }

                      @Override
                      public void onStopTrackingTouch(SeekBar s) {
                      }
                  });
                  root.addView(tolBar);

                  regionLabel = new TextView(this);
                  regionLabel.setTextColor(Color.WHITE);
                  regionLabel.setTextSize(14);
                  regionLabel.setPadding(0, dp(8), 0, 0);
                  root.addView(regionLabel);

                  Button regBtn = new Button(this);
                  regBtn.setText("Взять последнюю область с панели");
                  regBtn.setOnClickListener(v -> {
                      if (prefs.contains("lrl")) {
                          rule.rl = prefs.getInt("lrl", -1);
                          rule.rt = prefs.getInt("lrt", -1);
                          rule.rr = prefs.getInt("lrr", -1);
                          rule.rb = prefs.getInt("lrb", -1);
                          updateLabels();
                      } else {
                          Toast.makeText(this, "Сначала выбери область кнопкой «Область» на панели",
                                  Toast.LENGTH_LONG).show();
                      }
                  });
                  root.addView(regBtn);

                  Button regClear = new Button(this);
                  regClear.setText("Сбросить область (весь экран)");
                  regClear.setOnClickListener(v -> {
                      rule.rl = -1;
                      rule.rt = -1;
                      rule.rr = -1;
                      rule.rb = -1;
                      updateLabels();
                  });
                  root.addView(regClear);

                  repeatBtn = new Button(this);
                  repeatBtn.setOnClickListener(v -> {
                      int cur = 0;
                      for (int i = 0; i < MODES.length; i++) {
                          if (MODES[i].equals(rule.repeat)) cur = i;
                      }
                      rule.repeat = MODES[(cur + 1) % MODES.length];
                      updateLabels();
                  });
                  root.addView(repeatBtn);

                  TextView dl = new TextView(this);
                  dl.setText("Интервал повтора, мс (для режима «повторять каждые N мс»)");
                  dl.setTextColor(0xFFBBBBBB);
                  dl.setTextSize(13);
                  root.addView(dl);
                  delayEt = new EditText(this);
                  delayEt.setInputType(InputType.TYPE_CLASS_NUMBER);
                  delayEt.setTextColor(Color.WHITE);
                  root.addView(delayEt);

                  TextView stepsTitle = new TextView(this);
                  stepsTitle.setText("Шаги (до 50)");
                  stepsTitle.setTextColor(Color.WHITE);
                  stepsTitle.setTextSize(18);
                  stepsTitle.setPadding(0, dp(16), 0, dp(8));
                  root.addView(stepsTitle);

                  stepsBox = new LinearLayout(this);
                  stepsBox.setOrientation(LinearLayout.VERTICAL);
                  root.addView(stepsBox);

                  Button addStep = new Button(this);
                  addStep.setText("+ Добавить шаг");
                  addStep.setOnClickListener(v -> {
                      if (rule.steps.size() >= 50) {
                          Toast.makeText(this, "Максимум 50 шагов", Toast.LENGTH_SHORT).show();
                          return;
                      }
                      Step s = new Step();
                      s.x = prefs.getInt("lastx", 500);
                      s.y = prefs.getInt("lasty", 1000);
                      s.delay = 500;
                      rule.steps.add(s);
                      persist();
                      rebuildSteps();
                  });
                  root.addView(addStep);

                  Button done = new Button(this);
                  done.setText("Готово");
                  done.setOnClickListener(v -> finish());
                  root.addView(done);

                  setContentView(sv);
                  fillFromRule();
                  rebuildSteps();
              }

              private void fillFromRule() {
                  tolBar.setProgress(rule.tolerance);
                  delayEt.setText(String.valueOf(rule.repeatDelay));
                  updateLabels();
              }

              private void updateLabels() {
                  colorBtn.setText(String.format("Цвет: #%06X (нажми, чтобы изменить)", rule.color & 0xFFFFFF));
                  colorBtn.setTextColor(rule.color | 0xFF000000);
                  tolLabel.setText("Допуск цвета: " + rule.tolerance);
                  if (rule.hasRegion()) {
                      regionLabel.setText("Область: " + rule.rl + "," + rule.rt + " — " + rule.rr + "," + rule.rb);
                  } else {
                      regionLabel.setText("Область: весь экран");
                  }
                  String mn = MODE_NAMES[0];
                  for (int i = 0; i < MODES.length; i++) {
                      if (MODES[i].equals(rule.repeat)) mn = MODE_NAMES[i];
                  }
                  repeatBtn.setText("Повтор: " + mn);
              }

              private void persist() {
                  if (rule == null) return;
                  String n = nameEt.getText().toString().trim();
                  rule.name = n.isEmpty() ? "Правило" : n;
                  try {
                      rule.repeatDelay = Math.max(100, Integer.parseInt(delayEt.getText().toString().trim()));
                  } catch (Exception ignored) {
                  }
                  rm.save(rules);
              }

              private void pickColor() {
                  final boolean hasLast = prefs.contains("lastcolor");
                  String[] items = hasLast
                          ? new String[]{String.format("Взять цвет пипетки (#%06X)", prefs.getInt("lastcolor", 0) & 0xFFFFFF),
                          "Ввести HEX вручную"}
                          : new String[]{"Ввести HEX вручную (пипетка: кнопка «Пипетка» на панели)"};
                  new AlertDialog.Builder(this)
                          .setTitle("Цвет правила")
                          .setItems(items, (d, which) -> {
                              if (hasLast && which == 0) {
                                  rule.color = prefs.getInt("lastcolor", rule.color) | 0xFF000000;
                                  updateLabels();
                              } else {
                                  hexDialog();
                              }
                          })
                          .show();
              }

              private void hexDialog() {
                  AlertDialog.Builder b = new AlertDialog.Builder(this);
                  b.setTitle("Цвет в HEX (RRGGBB)");
                  final EditText e = new EditText(this);
                  e.setText(String.format("%06X", rule.color & 0xFFFFFF));
                  b.setView(e);
                  b.setPositiveButton("OK", (d, w) -> {
                      try {
                          String t = e.getText().toString().trim().replace("#", "");
                          int c = (int) Long.parseLong(t, 16);
                          rule.color = 0xFF000000 | c;
                          updateLabels();
                      } catch (Exception ignored) {
                      }
                  });
                  b.setNegativeButton("Отмена", null);
                  b.show();
              }

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              private void rebuildSteps() {
                  stepsBox.removeAllViews();
                  for (int i = 0; i < rule.steps.size(); i++) {
                      final int sidx = i;
                      final Step s = rule.steps.get(i);
                      LinearLayout row = new LinearLayout(this);
                      row.setOrientation(LinearLayout.HORIZONTAL);
                      row.setGravity(Gravity.CENTER_VERTICAL);
                      row.setPadding(0, dp(4), 0, dp(4));

                      TextView t = new TextView(this);
                      t.setText("Шаг " + (i + 1) + ":  (" + s.x + ", " + s.y + ")  пауза " + s.delay + " мс");
                      t.setTextColor(Color.WHITE);
                      t.setTextSize(14);
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                              0, LinearLayout.LayoutParams.WRAP_CONTENT, 1);
                      t.setLayoutParams(lp);
                      row.addView(t);

                      Button ed = new Button(this);
                      ed.setText("Изм.");
                      ed.setOnClickListener(v -> {
                          persist();
                          Intent it = new Intent(this, StepEditActivity.class);
                          it.putExtra("ri", idx);
                          it.putExtra("si", sidx);
                          startActivity(it);
                      });
                      row.addView(ed);

                      Button del = new Button(this);
                      del.setText("✕");
                      del.setOnClickListener(v -> {
                          rule.steps.remove(sidx);
                          persist();
                          rebuildSteps();
                      });
                      row.addView(del);

                      stepsBox.addView(row);
                  }
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  persist();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (stepsBox == null) return;
                  rules = rm.load();
                  if (idx >= 0 && idx < rules.size()) {
                      rule = rules.get(idx);
                      fillFromRule();
                  }
                  rebuildSteps();
              }
          }
