                  setContentView(sv);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  status.setText("Служба доступности: "
                          + (TapService.inst != null ? "включена" : "выключена"));
              }

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              private TextView label(String text, int size) {
                  TextView t = new TextView(this);
                  t.setText(text);
                  t.setTextSize(size);
                  t.setTextColor(Color.WHITE);
                  t.setPadding(0, size > 20 ? 0 : dp(8), 0, dp(8));
                  return t;
              }

              private void saveProfileDialog() {
                  android.app.AlertDialog.Builder b =
                          new android.app.AlertDialog.Builder(this);
                  b.setTitle("Имя профиля");
                  final android.widget.EditText e = new android.widget.EditText(this);
                  b.setView(e);
                  b.setPositiveButton("Сохранить", (d, w) -> {
                      String name = e.getText().toString().trim();
                      if (!name.isEmpty()) {
                          rm.saveProfile(name, rm.load());
                          Toast.makeText(this, "Профиль сохранён", Toast.LENGTH_SHORT).show();
                      }
                  });
                  b.setNegativeButton("Отмена", null);
                  b.show();
              }

              private void loadProfileDialog() {
                  final java.util.List<String> names = rm.profileNames();
                  if (names.isEmpty()) {
                      Toast.makeText(this, "Нет сохранённых профилей", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  android.app.AlertDialog.Builder b =
                          new android.app.AlertDialog.Builder(this);
                  b.setTitle("Загрузить профиль");
                  b.setItems(names.toArray(new String[0]), (d, i) -> {
                      rm.save(rm.loadProfile(names.get(i)));
                      Toast.makeText(this, "Профиль загружен", Toast.LENGTH_SHORT).show();
                  });
                  b.setNeutralButton("Удалить…", (d, w) -> {
                      android.app.AlertDialog.Builder b2 =
                              new android.app.AlertDialog.Builder(this);
                      b2.setTitle("Удалить профиль");
                      b2.setItems(names.toArray(new String[0]), (dd, ii) -> {
                          rm.deleteProfile(names.get(ii));
                          Toast.makeText(this, "Удалён", Toast.LENGTH_SHORT).show();
                      });
                      b2.show();
                  });
                  b.show();
              }

              private void start() {
                  if (TapService.inst == null) {
                      Toast.makeText(this, "Включи службу доступности",
                              Toast.LENGTH_LONG).show();
                      startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                      return;
                  }
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "Разреши показ поверх других окон",
                              Toast.LENGTH_LONG).show();
                      startActivity(new Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:" + getPackageName())));
                      return;
                  }
                  if (Build.VERSION.SDK_INT >= 33 && !askedNotifications
                          && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)
                          != PackageManager.PERMISSION_GRANTED) {
                      askedNotifications = true;
                      requestPermissions(
                              new String[]{Manifest.permission.POST_NOTIFICATIONS}, 7);
                      return;
                  }
                  MediaProjectionManager m = (MediaProjectionManager)
                          getSystemService(MEDIA_PROJECTION_SERVICE);
                  startActivityForResult(m.createScreenCaptureIntent(), 1);
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] res) {
                  super.onRequestPermissionsResult(code, perms, res);
                  start();
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req == 1 && res == RESULT_OK && data != null) {
                      Intent i = new Intent(this, ColorService.class);
                      i.putExtra("code", res);
                      i.putExtra("data", data);
                      startForegroundService(i);
                      moveTaskToBack(true);
                  }
              }
          }
