          package com.mushka.colortap;

          import org.json.JSONException;
          import org.json.JSONObject;

          public class Step {
              public int x = 0;
              public int y = 0;
              public int delay = 500;

              public JSONObject toJson() throws JSONException {
                  JSONObject o = new JSONObject();
                  o.put("x", x);
                  o.put("y", y);
                  o.put("delay", delay);
                  return o;
              }

              public static Step fromJson(JSONObject o) throws JSONException {
                  Step s = new Step();
                  s.x = o.optInt("x", 0);
                  s.y = o.optInt("y", 0);
                  s.delay = o.optInt("delay", 500);
                  return s;
              }
          }
