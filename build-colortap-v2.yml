                      rules.add(r);
                      rm.save(rules);
                      rebuild();
                  });
                  root.addView(add);

                  Button back = new Button(this);
                  back.setText("Назад");
                  back.setOnClickListener(v -> finish());
                  root.addView(back);

                  setContentView(sv);
                  rebuild();
