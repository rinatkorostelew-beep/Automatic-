                      del.setText("✕");
                      del.setOnClickListener(v -> {
                          rules.remove(idx);
                          rm.save(rules);
                          rebuild();
                      });
                      row.addView(del);

                      list.addView(row);
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  rules = rm.load();
                  rebuild();
              }
          }
