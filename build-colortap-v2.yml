name: Build ColorTap v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/build-colortap-v2.yml"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Принять лицензии Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Создать проект
        run: |
          mkdir -p app
          cat > app/build.gradle <<'FILE_0_END'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mushka.colortap'
              compileSdk 34

              defaultConfig {
                  applicationId "com.mushka.colortap"
                  minSdk 26
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }
          FILE_0_END
          cat > build.gradle <<'FILE_1_END'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          FILE_1_END
          cat > gradle.properties <<'FILE_2_END'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          FILE_2_END
          cat > settings.gradle <<'FILE_3_END'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ColorTap"
          include ':app'
          FILE_3_END
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'FILE_4_END'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="Автокликер по цвету"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".RulesActivity"
                      android:exported="false" />

                  <activity
                      android:name=".RuleEditActivity"
                      android:exported="false" />

                  <activity
                      android:name=".StepEditActivity"
                      android:exported="false" />

                  <service
                      android:name=".ColorService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />

                  <service
                      android:name=".TapService"
                      android:exported="true"
                      android:label="Автокликер по цвету"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/tap_service" />
                  </service>
              </application>
          </manifest>
          FILE_4_END
          mkdir -p app/src/main/java/com/mushka/colortap
          cat > app/src/main/java/com/mushka/colortap/ColorService.java <<'FILE_5_END'
          package com.mushka.colortap;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ServiceInfo;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.PixelFormat;
          import android.graphics.Rect;
          import android.graphics.drawable.GradientDrawable;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.media.Image;
          import android.media.ImageReader;
          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.util.DisplayMetrics;
          import android.view.Display;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.nio.ByteBuffer;
          import java.util.List;

          public class ColorService extends Service {
              private static final int STEP = 3;
              private static final int CELL = 48;

              private final Handler h = new Handler(Looper.getMainLooper());
              private WindowManager wm;
              private MediaProjection mp;
              private MediaProjection.Callback mpCallback;
              private VirtualDisplay vd;
              private ImageReader reader;
              private int cw;
              private int ch;
              private int dpi;
              private SharedPreferences prefs;
              private RuleManager rm;

              private LinearLayout bar;
              private WindowManager.LayoutParams barLp;
              private TextView bGo;
              private TextView bInfo;
              private View ovl;
              private PickView pv;

              private boolean running;
              private boolean executing;
              private List<Rule> rules;
              private boolean[] armed;
              private boolean[] done;
              private long[] lastFire;
              private int[][] lastPts;
              private volatile boolean dirty = true;
              private int activeRule = -1;
              private int activeStep = -1;
              private final SharedPreferences.OnSharedPreferenceChangeListener prefListener =
                      (sp, key) -> {
                          if ("rules_v2".equals(key)) dirty = true;
                      };

              @Override
              public IBinder onBind(Intent in) {
                  return null;
              }

              @Override
              public int onStartCommand(Intent in, int flags, int startId) {
                  if (in == null || "STOP".equals(in.getAction())) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  if (mp != null) return START_NOT_STICKY;
                  prefs = getSharedPreferences("c", MODE_PRIVATE);
                  rm = new RuleManager(this);
                  prefs.registerOnSharedPreferenceChangeListener(prefListener);
                  startFg();

                  MediaProjectionManager m =
                          (MediaProjectionManager) getSystemService(MEDIA_PROJECTION_SERVICE);
                  mp = m.getMediaProjection(in.getIntExtra("code", 0),
                          (Intent) in.getParcelableExtra("data"));
                  if (mp == null) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  mpCallback = new MediaProjection.Callback() {
                      @Override
                      public void onStop() {
                          stopSelf();
                      }
                  };
                  mp.registerCallback(mpCallback, h);
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  makeDisplay();
                  showBar();
                  return START_NOT_STICKY;
              }

              private void startFg() {
                  NotificationManager nm =
                          (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  nm.createNotificationChannel(new NotificationChannel("c", "Автокликер",
                          NotificationManager.IMPORTANCE_LOW));
                  Intent stop = new Intent(this, ColorService.class).setAction("STOP");
                  PendingIntent pi = PendingIntent.getService(this, 1, stop,
                          PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Notification n = new Notification.Builder(this, "c")
                          .setSmallIcon(android.R.drawable.ic_menu_search)
                          .setContentTitle("Автокликер работает")
                          .setContentText("Нажми «Остановить», чтобы выключить")
                          .addAction(new Notification.Action.Builder(
                                  android.R.drawable.ic_menu_close_clear_cancel,
                                  "Остановить", pi).build())
                          .setOngoing(true)
                          .build();
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n,
                              ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION);
                  } else {
                      startForeground(1, n);
                  }
              }

              private DisplayMetrics realMetrics() {
                  DisplayMetrics dm = new DisplayMetrics();
                  DisplayManager dmg =
                          (DisplayManager) getSystemService(Context.DISPLAY_SERVICE);
                  dmg.getDisplay(Display.DEFAULT_DISPLAY).getRealMetrics(dm);
                  return dm;
              }

              private void makeDisplay() {
                  DisplayMetrics dm = realMetrics();
                  cw = dm.widthPixels;
                  ch = dm.heightPixels;
                  dpi = dm.densityDpi;
                  reader = ImageReader.newInstance(cw, ch, PixelFormat.RGBA_8888, 2);
                  vd = mp.createVirtualDisplay("cap", cw, ch, dpi,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                          reader.getSurface(), null, h);
              }

              private void fitDisplay() {
                  DisplayMetrics dm = realMetrics();
                  if (dm.widthPixels == cw && dm.heightPixels == ch) return;
                  cw = dm.widthPixels;
                  ch = dm.heightPixels;
                  ImageReader old = reader;
                  reader = ImageReader.newInstance(cw, ch, PixelFormat.RGBA_8888, 2);
                  vd.resize(cw, ch, dpi);
                  vd.setSurface(reader.getSurface());
                  old.close();
                  lastPts = null;
              }

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              private void toast(String s) {
                  Toast.makeText(this, s, Toast.LENGTH_SHORT).show();
              }

              private WindowManager.LayoutParams params(int w, int hh) {
                  WindowManager.LayoutParams lp = new WindowManager.LayoutParams(w, hh,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                  | WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT);
                  lp.gravity = Gravity.TOP | Gravity.START;
                  if (Build.VERSION.SDK_INT >= 30) {
                      lp.layoutInDisplayCutoutMode =
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS;
                  } else if (Build.VERSION.SDK_INT >= 28) {
                      lp.layoutInDisplayCutoutMode =
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  }
                  return lp;
              }

              private TextView btn(String text) {
                  TextView t = new TextView(this);
                  t.setText(text);
                  t.setTextColor(Color.WHITE);
                  t.setTextSize(14);
                  t.setPadding(dp(10), dp(8), dp(10), dp(8));
                  return t;
              }

              private void showBar() {
                  bar = new LinearLayout(this);
                  bar.setOrientation(LinearLayout.HORIZONTAL);
                  bar.setGravity(Gravity.CENTER_VERTICAL);
                  bar.setPadding(dp(6), dp(4), dp(6), dp(4));
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(0xEE171A2C);
                  g.setCornerRadius(dp(22));
                  g.setStroke(dp(1), 0x556C8CFF);
                  bar.setBackground(g);

                  TextView handle = btn("≡");
                  bInfo = btn("0/0");
                  TextView bPick = btn("Пипетка");
                  TextView bReg = btn("Область");
                  TextView bRules = btn("Правила");
                  bGo = btn("Старт");
                  TextView bX = btn("✕");

                  bar.addView(handle);
                  bar.addView(bInfo);
                  bar.addView(bPick);
                  bar.addView(bReg);
                  bar.addView(bRules);
                  bar.addView(bGo);
                  bar.addView(bX);

                  bPick.setOnClickListener(v -> startPick());
                  bReg.setOnClickListener(v -> startRegion());
                  bRules.setOnClickListener(v -> {
                      Intent i = new Intent(this, RulesActivity.class);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(i);
                  });
                  bGo.setOnClickListener(v -> toggle());
                  bX.setOnClickListener(v -> stopSelf());

                  barLp = params(WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.WRAP_CONTENT);
                  barLp.x = dp(12);
                  barLp.y = dp(80);

                  handle.setOnTouchListener(new View.OnTouchListener() {
                      float dx, dy;

                      @Override
                      public boolean onTouch(View v, MotionEvent e) {
                          switch (e.getAction()) {
                              case MotionEvent.ACTION_DOWN:
                                  dx = e.getRawX() - barLp.x;
                                  dy = e.getRawY() - barLp.y;
                                  return true;
                              case MotionEvent.ACTION_MOVE:
                                  barLp.x = (int) (e.getRawX() - dx);
                                  barLp.y = (int) (e.getRawY() - dy);
                                  wm.updateViewLayout(bar, barLp);
                                  return true;
                              default:
                                  return true;
                          }
                      }
                  });
                  wm.addView(bar, barLp);
                  updateBar();
              }

              private void updateBar() {
                  if (bar == null) return;
                  bGo.setText(running ? "Стоп" : "Старт");
                  int en = 0, tot = 0;
                  List<Rule> rl = rm.load();
                  for (Rule r : rl) {
                      tot++;
                      if (r.enabled && !r.steps.isEmpty()) en++;
                  }
                  if (activeRule >= 0 && activeStep >= 0 && activeRule < rl.size()) {
                      bInfo.setText((activeRule + 1) + ":" + (activeStep + 1));
                  } else {
                      bInfo.setText(en + "/" + tot);
                  }
              }

              private void reloadRules() {
                  rules = rm.load();
                  int n = rules.size();
                  armed = new boolean[n];
                  done = new boolean[n];
                  lastFire = new long[n];
                  java.util.Arrays.fill(armed, true);
                  lastPts = null;
                  dirty = false;
              }

              private void toggle() {
                  if (running) {
                      running = false;
                      executing = false;
                      activeRule = -1;
                      activeStep = -1;
                  } else {
                      if (TapService.inst == null) {
                          toast("Включи службу доступности");
                          return;
                      }
                      reloadRules();
                      boolean any = false;
                      for (Rule r : rules) {
                          if (r.enabled && !r.steps.isEmpty()) any = true;
                      }
                      if (!any) {
                          toast("Нет активных правил с шагами");
                          return;
                      }
                      running = true;
                      h.post(scan);
                  }
                  updateBar();
              }

              private final Runnable scan = new Runnable() {
                  @Override
                  public void run() {
                      if (!running) return;
                      if (!executing) {
                          try {
                              doScan();
                          } catch (Exception ignored) {
                          }
                      }
                      h.postDelayed(this, Math.max(30, prefs.getInt("iv", 100)));
                  }
              };

              private void doScan() {
                  if (ovl != null) return;
                  if (dirty || rules == null) reloadRules();
                  if (rules.isEmpty()) return;
                  fitDisplay();
                  Image img = reader.acquireLatestImage();
                  int[][] pts;
                  if (img != null) {
                      try {
                          pts = find(img);
                      } finally {
                          img.close();
                      }
                      lastPts = pts;
                  } else {
                      pts = lastPts;
                  }
                  if (pts == null || pts.length != rules.size()) return;
                  long now = android.os.SystemClock.uptimeMillis();
                  int fire = -1;
                  for (int i = 0; i < rules.size(); i++) {
                      Rule r = rules.get(i);
                      if (!r.enabled || r.steps.isEmpty()) continue;
                      if (pts[i] == null) {
                          armed[i] = true;
                          continue;
                      }
                      if (fire >= 0) continue;
                      boolean ok;
                      if ("interval".equals(r.repeat)) {
                          ok = now - lastFire[i] >= Math.max(100, r.repeatDelay);
                      } else if ("once".equals(r.repeat)) {
                          ok = !done[i];
                      } else {
                          ok = armed[i];
                      }
                      if (ok) fire = i;
                  }
                  if (fire < 0) return;
                  armed[fire] = false;
                  done[fire] = true;
                  lastFire[fire] = now;
                  runChain(fire, rules.get(fire));
              }

              private void runChain(final int ri, final Rule r) {
                  executing = true;
                  activeRule = ri;
                  activeStep = 0;
                  h.post(new Runnable() {
                      int i = 0;

                      @Override
                      public void run() {
                          if (!running || i >= r.steps.size()) {
                              finishChain();
                              return;
                          }
                          Step s = r.steps.get(i);
                          activeStep = i;
                          updateBar();
                          TapService.tap(s.x, s.y);
                          i++;
                          h.postDelayed(this, Math.max(30, s.delay));
                      }
                  });
              }

              private void finishChain() {
                  executing = false;
                  activeRule = -1;
                  activeStep = -1;
                  updateBar();
              }

              // один проход по экрану сразу для всех правил; результат: точка для каждого правила или null
              private int[][] find(Image img) {
                  Image.Plane pl = img.getPlanes()[0];
                  ByteBuffer b = pl.getBuffer();
                  int ps = pl.getPixelStride();
                  int rs = pl.getRowStride();
                  int w = img.getWidth();
                  int hh = img.getHeight();
                  int n = rules.size();
                  int cols = (w + CELL - 1) / CELL;
                  int rows = (hh + CELL - 1) / CELL;

                  int[] act = new int[n];
                  int na = 0;
                  int[] tr = new int[n];
                  int[] tg = new int[n];
                  int[] tb = new int[n];
                  int[] tl = new int[n];
                  int[][] cnt = new int[n][];
                  long[][] sx = new long[n][];
                  long[][] sy = new long[n][];
                  for (int k = 0; k < n; k++) {
                      Rule r = rules.get(k);
                      if (!r.enabled || r.steps.isEmpty()) continue;
                      act[na++] = k;
                      tr[k] = Color.red(r.color);
                      tg[k] = Color.green(r.color);
                      tb[k] = Color.blue(r.color);
                      tl[k] = r.tolerance;
                      cnt[k] = new int[cols * rows];
                      sx[k] = new long[cols * rows];
                      sy[k] = new long[cols * rows];
                  }
                  Rect ex = null;
                  if (bar != null) {
                      ex = new Rect(barLp.x - dp(4), barLp.y - dp(4),
                              barLp.x + bar.getWidth() + dp(4),
                              barLp.y + bar.getHeight() + dp(4));
                  }

                  for (int y = 0; y < hh; y += STEP) {
                      for (int x = 0; x < w; x += STEP) {
                          if (ex != null && ex.contains(x, y)) continue;
                          int o = y * rs + x * ps;
                          int pr = b.get(o) & 0xFF;
                          int pg = b.get(o + 1) & 0xFF;
                          int pb = b.get(o + 2) & 0xFF;
                          for (int a = 0; a < na; a++) {
                              int k = act[a];
                              Rule r = rules.get(k);
                              if (r.hasRegion() && (x < r.rl || x >= r.rr || y < r.rt || y >= r.rb)) continue;
                              if (Math.abs(pr - tr[k]) <= tl[k]
                                      && Math.abs(pg - tg[k]) <= tl[k]
                                      && Math.abs(pb - tb[k]) <= tl[k]) {
                                  int c = (y / CELL) * cols + (x / CELL);
                                  cnt[k][c]++;
                                  sx[k][c] += x;
                                  sy[k][c] += y;
                              }
                          }
                      }
                  }
                  int[][] res = new int[n][];
                  for (int a = 0; a < na; a++) {
                      int k = act[a];
                      int best = -1;
                      int bestN = 2;
                      for (int i = 0; i < cnt[k].length; i++) {
                          if (cnt[k][i] > bestN) {
                              bestN = cnt[k][i];
                              best = i;
                          }
                      }
                      if (best >= 0) {
                          res[k] = new int[]{(int) (sx[k][best] / cnt[k][best]), (int) (sy[k][best] / cnt[k][best])};
                      }
                  }
                  return res;
              }

              // ---------- пипетка цвета (используется только внутри) ----------
              private void startPick() {
                  if (ovl != null) return;
                  bar.setVisibility(View.INVISIBLE);
                  ovl = new View(this);
                  h.postDelayed(() -> grabForPick(0), 250);
              }

              private void grabForPick(final int n) {
                  try {
                      fitDisplay();
                  } catch (Exception ignored) {
                  }
                  Image img = reader.acquireLatestImage();
                  if (img == null) {
                      if (n < 12) {
                          h.postDelayed(() -> grabForPick(n + 1), 120);
                      } else {
                          ovl = null;
                          bar.setVisibility(View.VISIBLE);
                          toast("Не удалось снять экран");
                      }
                      return;
                  }
                  Bitmap shot;
                  try {
                      Image.Plane pl = img.getPlanes()[0];
                      Bitmap full = Bitmap.createBitmap(
                              pl.getRowStride() / pl.getPixelStride(),
                              img.getHeight(), Bitmap.Config.ARGB_8888);
                      full.copyPixelsFromBuffer(pl.getBuffer());
                      shot = Bitmap.createBitmap(full, 0, 0, img.getWidth(), img.getHeight());
                      if (shot != full) full.recycle();
                  } finally {
                      img.close();
                  }
                  pv = new PickView(this, shot);
                  ovl = pv;
                  wm.addView(pv, params(WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.MATCH_PARENT));
              }

              private void finishPick(boolean ok) {
                  int col = 0;
                  float pvx = pv.px;
                  float pvy = pv.py;
                  if (ok) col = pv.pix((int) pvx, (int) pvy) | 0xFF000000;
                  wm.removeView(pv);
                  pv.shot.recycle();
                  pv = null;
                  ovl = null;
                  bar.setVisibility(View.VISIBLE);
                  if (ok) {
                      prefs.edit().putInt("lastcolor", col)
                              .putInt("lastx", (int) pvx).putInt("lasty", (int) pvy).apply();
                      toast(String.format("Сохранено: цвет #%06X и точка (%d, %d). Применить можно в «Правила»",
                              col & 0xFFFFFF, (int) pvx, (int) pvy));
                  }
              }

              private class PickView extends View {
                  final Bitmap shot;
                  final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  float px, py;
                  boolean has;

                  PickView(Context c, Bitmap s) {
                      super(c);
                      shot = s;
                      p.setTextSize(dp(15));
                  }

                  int pix(int x, int y) {
                      x = Math.max(0, Math.min(shot.getWidth() - 1, x));
                      y = Math.max(0, Math.min(shot.getHeight() - 1, y));
                      return shot.getPixel(x, y);
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      int[] o = new int[2];
                      getLocationOnScreen(o);
                      c.drawBitmap(shot, -o[0], -o[1], null);
                      int w = getWidth();
                      int hh = getHeight();
                      int bh = dp(64);
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(0xAA000000);
                      c.drawRect(0, 0, w, dp(40), p);
                      p.setColor(Color.WHITE);
                      c.drawText("Проведи пальцем по цвету", dp(12), dp(26), p);
                      p.setColor(0xEE171A2C);
                      c.drawRect(0, hh - bh, w, hh, p);
                      p.setColor(Color.WHITE);
                      c.drawText("Отмена", dp(24), hh - bh / 2f + dp(5), p);
                      if (!has) return;
                      float vx = px - o[0];
                      float vy = py - o[1];
                      int col = pix((int) px, (int) py) | 0xFF000000;
                      int cell = dp(9);
                      int n = 11;
                      int size = cell * n;
                      float lx = Math.max(dp(8), Math.min(w - size - dp(8), vx - size / 2f));
                      float ly = vy - dp(44) - size;
                      if (ly < dp(48)) ly = vy + dp(44);
                      for (int i = 0; i < n; i++) {
                          for (int j = 0; j < n; j++) {
                              p.setStyle(Paint.Style.FILL);
                              p.setColor(pix((int) px + i - 5, (int) py + j - 5) | 0xFF000000);
                              c.drawRect(lx + i * cell, ly + j * cell,
                                      lx + (i + 1) * cell, ly + (j + 1) * cell, p);
                          }
                      }
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(dp(2));
                      p.setColor(Color.WHITE);
                      c.drawRect(lx, ly, lx + size, ly + size, p);
                      p.setColor(Color.BLACK);
                      c.drawRect(lx + 5 * cell, ly + 5 * cell,
                              lx + 6 * cell, ly + 6 * cell, p);
                      p.setColor(Color.WHITE);
                      c.drawCircle(vx, vy, dp(14), p);
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(col);
                      c.drawRect(w / 2f, hh - bh, w, hh, p);
                      boolean light = (Color.red(col) * 299 + Color.green(col) * 587
                              + Color.blue(col) * 114) / 1000 > 140;
                      p.setColor(light ? Color.BLACK : Color.WHITE);
                      c.drawText(String.format("Выбрать #%06X", col & 0xFFFFFF),
                              w / 2f + dp(16), hh - bh / 2f + dp(5), p);
                  }

                  @Override
                  public boolean onTouchEvent(MotionEvent e) {
                      float rx = e.getRawX();
                      float ry = e.getRawY();
                      boolean inBtn = ry > ch - dp(64);
                      switch (e.getAction()) {
                          case MotionEvent.ACTION_DOWN:
                          case MotionEvent.ACTION_MOVE:
                              if (!inBtn) {
                                  px = rx;
                                  py = ry;
                                  has = true;
                                  invalidate();
                              }
                              return true;
                          case MotionEvent.ACTION_UP:
                              if (inBtn) {
                                  if (rx < cw / 2f) finishPick(false);
                                  else if (has) finishPick(true);
                              }
                              return true;
                          default:
                              return true;
                      }
                  }
              }

              // ---------- область поиска ----------
              private void startRegion() {
                  if (ovl != null) return;
                  bar.setVisibility(View.INVISIBLE);
                  ovl = new RegView(this);
                  wm.addView(ovl, params(WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.MATCH_PARENT));
              }

              private void endRegion(Rect rc) {
                  wm.removeView(ovl);
                  ovl = null;
                  bar.setVisibility(View.VISIBLE);
                  if (rc.width() >= dp(24) && rc.height() >= dp(24)) {
                      prefs.edit().putInt("lrl", rc.left).putInt("lrt", rc.top)
                              .putInt("lrr", rc.right).putInt("lrb", rc.bottom).apply();
                      toast("Область сохранена. Применить можно в «Правила»");
                  }
              }

              private class RegView extends View {
                  final Paint dim = new Paint();
                  final Paint line = new Paint();
                  final Paint txt = new Paint();
                  float x0, y0, x1, y1;
                  boolean has;

                  RegView(Context c) {
                      super(c);
                      dim.setColor(0x88000000);
                      line.setColor(0xFF6C8CFF);
                      line.setStyle(Paint.Style.STROKE);
                      line.setStrokeWidth(dp(2));
                      txt.setColor(Color.WHITE);
                      txt.setTextSize(dp(16));
                      txt.setAntiAlias(true);
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      int[] o = new int[2];
                      getLocationOnScreen(o);
                      int w = getWidth();
                      int hh = getHeight();
                      if (!has) {
                          c.drawRect(0, 0, w, hh, dim);
                          c.drawText("Выдели область, где искать цвет", dp(24), dp(80), txt);
                          return;
                      }
                      float l = Math.min(x0, x1) - o[0];
                      float r = Math.max(x0, x1) - o[0];
                      float t = Math.min(y0, y1) - o[1];
                      float b = Math.max(y0, y1) - o[1];
                      c.drawRect(0, 0, w, t, dim);
                      c.drawRect(0, b, w, hh, dim);
                      c.drawRect(0, t, l, b, dim);
                      c.drawRect(r, t, w, b, dim);
                      c.drawRect(l, t, r, b, line);
                  }

                  @Override
                  public boolean onTouchEvent(MotionEvent e) {
                      switch (e.getAction()) {
                          case MotionEvent.ACTION_DOWN:
                              x0 = e.getRawX();
                              x1 = x0;
                              y0 = e.getRawY();
                              y1 = y0;
                              has = true;
                              invalidate();
                              return true;
                          case MotionEvent.ACTION_MOVE:
                              x1 = e.getRawX();
                              y1 = e.getRawY();
                              invalidate();
                              return true;
                          case MotionEvent.ACTION_UP:
                              x1 = e.getRawX();
                              y1 = e.getRawY();
                              endRegion(new Rect((int) Math.min(x0, x1), (int) Math.min(y0, y1),
                                      (int) Math.max(x0, x1), (int) Math.max(y0, y1)));
                              return true;
                          default:
                              return true;
                      }
                  }
              }

              @Override
              public void onDestroy() {
                  running = false;
                  if (prefs != null) prefs.unregisterOnSharedPreferenceChangeListener(prefListener);
                  h.removeCallbacksAndMessages(null);
                  try {
                      if (ovl != null && ovl.getParent() != null) wm.removeView(ovl);
                  } catch (Exception ignored) {
                  }
                  try {
                      if (bar != null) wm.removeView(bar);
                  } catch (Exception ignored) {
                  }
                  if (vd != null) vd.release();
                  if (reader != null) reader.close();
                  if (mp != null) {
                      try {
                          mp.unregisterCallback(mpCallback);
                          mp.stop();
                      } catch (Exception ignored) {
                      }
                  }
                  super.onDestroy();
              }
          }
