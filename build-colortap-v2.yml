                  exp.setOnClickListener(v -> {
                      String json = rm.exportAll();
                      ClipboardManager cm = (ClipboardManager)
                              getSystemService(Context.CLIPBOARD_SERVICE);
                      cm.setPrimaryClip(ClipData.newPlainText("colortap", json));
                      Toast.makeText(this, "Скопировано в буфер", Toast.LENGTH_SHORT).show();
                  });
                  root.addView(exp);

                  Button imp = new Button(this);
                  imp.setText("Импорт из буфера обмена");
                  imp.setOnClickListener(v -> {
                      ClipboardManager cm = (ClipboardManager)
                              getSystemService(Context.CLIPBOARD_SERVICE);
                      if (cm.hasPrimaryClip() && cm.getPrimaryClip().getItemCount() > 0) {
                          String json = cm.getPrimaryClip().getItemAt(0)
                                  .coerceToText(this).toString();
                          rm.importAll(json);
                          Toast.makeText(this, "Импортировано", Toast.LENGTH_SHORT).show();
                      } else {
                          Toast.makeText(this, "Буфер пуст", Toast.LENGTH_SHORT).show();
                      }
                  });
                  root.addView(imp);

                  Button clr = new Button(this);
                  clr.setText("Очистить всё");
                  clr.setOnClickListener(v -> {
                      rm.clearAll();
                      Toast.makeText(this, "Очищено", Toast.LENGTH_SHORT).show();
                  });
