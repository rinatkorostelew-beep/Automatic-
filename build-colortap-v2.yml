                  root.addView(label("Приложение ищет заданный цвет на экране и выполняет цепочку тапов в указанные точки. Правил может быть сколько угодно, шагов в правиле — до 50. Пипетка (цвет и точка) и область поиска выбираются на плавающей панели после запуска.", 15));

                  status = label("", 14);
                  root.addView(status);

                  Button acc = new Button(this);
                  acc.setText("1. Включить службу доступности");
                  acc.setOnClickListener(v -> startActivity(
                          new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)));
                  root.addView(acc);

                  Button rules = new Button(this);
                  rules.setText("2. Правила и шаги");
                  rules.setOnClickListener(v -> startActivity(
                          new Intent(this, RulesActivity.class)));
                  root.addView(rules);

                  Button go = new Button(this);
                  go.setText("3. Запустить");
                  go.setOnClickListener(v -> start());
                  root.addView(go);

                  root.addView(label("", 8));
                  root.addView(label("Конфиги", 20));

                  Button saveProf = new Button(this);
                  saveProf.setText("Сохранить профиль как…");
                  saveProf.setOnClickListener(v -> saveProfileDialog());
                  root.addView(saveProf);

                  Button loadProf = new Button(this);
                  loadProf.setText("Загрузить профиль");
                  loadProf.setOnClickListener(v -> loadProfileDialog());
                  root.addView(loadProf);

