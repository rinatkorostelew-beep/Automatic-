          package com.mushka.colortap;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.text.InputType;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.util.List;

          public class StepEditActivity extends Activity {
              private RuleManager rm;
              private List<Rule> rules;
              private Rule rule;
              private Step step;
              private int ri, si;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  rm = new RuleManager(this);
                  rules = rm.load();
                  ri = getIntent().getIntExtra("ri", 0);
                  si = getIntent().getIntExtra("si", 0);
                  if (ri < 0 || ri >= rules.size()) { finish(); return; }
                  rule = rules.get(ri);
                  if (si < 0 || si >= rule.steps.size()) { finish(); return; }
                  step = rule.steps.get(si);

                  ScrollView sv = new ScrollView(this);
                  sv.setBackgroundColor(Color.parseColor("#0E1020"));
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  int pad = dp(16);
                  root.setPadding(pad, pad, pad, pad);
                  sv.addView(root);

                  TextView title = new TextView(this);
                  title.setText("Шаг " + (si + 1));
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(22);
                  root.addView(title);

                  root.addView(lbl("X (координата)"));
                  EditText ex = new EditText(this);
                  ex.setInputType(InputType.TYPE_CLASS_NUMBER);
                  ex.setText(String.valueOf(step.x));
                  ex.setTextColor(Color.WHITE);
                  root.addView(ex);

                  root.addView(lbl("Y (координата)"));
                  EditText ey = new EditText(this);
                  ey.setInputType(InputType.TYPE_CLASS_NUMBER);
                  ey.setText(String.valueOf(step.y));
                  ey.setTextColor(Color.WHITE);
                  root.addView(ey);

                  root.addView(lbl("Задержка после тапа, мс"));
                  EditText ed = new EditText(this);
                  ed.setInputType(InputType.TYPE_CLASS_NUMBER);
                  ed.setText(String.valueOf(step.delay));
                  ed.setTextColor(Color.WHITE);
                  root.addView(ed);

                  final android.content.SharedPreferences sp = getSharedPreferences("c", MODE_PRIVATE);
                  Button pt = new Button(this);
                  pt.setText(sp.contains("lastx")
                          ? "Взять точку пипетки (" + sp.getInt("lastx", 0) + ", " + sp.getInt("lasty", 0) + ")"
                          : "Точка не выбрана (используй «Пипетка» на панели)");
                  pt.setOnClickListener(v -> {
                      if (sp.contains("lastx")) {
                          ex.setText(String.valueOf(sp.getInt("lastx", 0)));
                          ey.setText(String.valueOf(sp.getInt("lasty", 0)));
                      }
                  });
                  root.addView(pt);

                  Button save = new Button(this);
                  save.setText("Сохранить");
                  save.setOnClickListener(v -> {
                      try {
                          step.x = Integer.parseInt(ex.getText().toString().trim());
                      } catch (Exception ignored) {}
                      try {
                          step.y = Integer.parseInt(ey.getText().toString().trim());
                      } catch (Exception ignored) {}
                      try {
                          step.delay = Integer.parseInt(ed.getText().toString().trim());
                      } catch (Exception ignored) {}
                      rm.save(rules);
                      finish();
                  });
                  root.addView(save);

                  Button back = new Button(this);
                  back.setText("Назад");
                  back.setOnClickListener(v -> finish());
                  root.addView(back);

                  setContentView(sv);
              }

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              private TextView lbl(String t) {
                  TextView v = new TextView(this);
                  v.setText(t);
                  v.setTextColor(0xFFBBBBBB);
                  v.setTextSize(14);
                  v.setPadding(0, dp(10), 0, dp(4));
                  return v;
              }
          }
