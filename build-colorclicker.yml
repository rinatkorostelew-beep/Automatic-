          package com.mushka.colorclicker;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.CheckBox;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import java.util.List;

          public class RulesActivity extends Activity {
              private Store store;
              private LinearLayout list;
              private List<Rule> rules;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  store = new Store(this);
                  LinearLayout root = Ui.column(this);
                  root.addView(Ui.text(this, "Правила", 24));
                  root.addView(Ui.text(this, "Правило: цвет, который ищем, и что нажать, когда он найден.", 14));

                  list = new LinearLayout(this);
                  list.setOrientation(LinearLayout.VERTICAL);
                  root.addView(list);

                  Button add = Ui.button(this, "+ Новое правило");
                  add.setOnClickListener(v -> {
                      rules = store.load();
                      Rule r = new Rule();
                      r.name = "Правило " + (rules.size() + 1);
                      r.steps.add(new Step());
                      rules.add(r);
                      store.save(rules);
                      openEditor(r.id);
                  });
                  root.addView(add);

                  Button back = Ui.button(this, "Назад");
                  back.setOnClickListener(v -> finish());
                  root.addView(back);
                  setContentView(Ui.scroll(this, root));
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  rules = store.load();
                  rebuild();
              }

              private void openEditor(long id) {
                  Intent it = new Intent(this, RuleEditActivity.class);
                  it.putExtra("id", id);
                  startActivity(it);
              }

              private void rebuild() {
                  list.removeAllViews();
                  if (rules.isEmpty()) {
                      list.addView(Ui.text(this, "Правил пока нет. Добавь правило или выбери цвет пипеткой на панели.", 14));
                  }
                  for (final Rule r : rules) {
                      LinearLayout row = new LinearLayout(this);
                      row.setOrientation(LinearLayout.HORIZONTAL);
                      row.setGravity(Gravity.CENTER_VERTICAL);

                      CheckBox cb = new CheckBox(this);
                      cb.setChecked(r.enabled);
                      cb.setOnCheckedChangeListener((view, on) -> {
                          r.enabled = on;
                          store.save(rules);
                      });
                      row.addView(cb);

                      View sw = new View(this);
                      sw.setBackgroundColor(r.firstColor());
                      sw.setLayoutParams(new LinearLayout.LayoutParams(Ui.dp(this, 22), Ui.dp(this, 22)));
                      row.addView(sw);

                      TextView name = new TextView(this);
                      name.setText("  " + r.name + (r.steps.isEmpty() ? " (нет шагов)" : ""));
                      name.setTextColor(Color.WHITE);
                      name.setTextSize(15);
                      name.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1));
                      row.addView(name);

                      Button edit = Ui.button(this, "Изм.");
                      edit.setOnClickListener(v -> openEditor(r.id));
                      row.addView(edit);

                      Button del = Ui.button(this, "✕");
                      del.setOnClickListener(v -> {
                          rules.remove(r);
                          store.save(rules);
                          rebuild();
                      });
                      row.addView(del);
                      list.addView(row);
                  }
              }
          }
