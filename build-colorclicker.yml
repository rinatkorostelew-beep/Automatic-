          package com.mushka.colorclicker;

          import org.json.JSONException;
          import org.json.JSONObject;

          /** Один шаг правила: нажатие на найденный цвет (type 0) или в фиксированную точку (type 1). */
          public class Step {
              public int type = 0;
              public int x = 500;
              public int y = 1000;
              public int delay = 300;

              public JSONObject toJson() throws JSONException {
                  JSONObject o = new JSONObject();
                  o.put("t", type);
                  o.put("x", x);
                  o.put("y", y);
                  o.put("d", delay);
                  return o;
              }

              public static Step fromJson(JSONObject o) {
                  Step s = new Step();
                  s.type = o.optInt("t", 0);
                  s.x = o.optInt("x", 500);
                  s.y = o.optInt("y", 1000);
                  s.delay = Math.max(30, o.optInt("d", 300));
                  return s;
              }
          }
