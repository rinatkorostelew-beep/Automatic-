name: Build Color Clicker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/build-colorclicker.yml"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Принять лицензии Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Создать проект
        run: |
          mkdir -p app
          cat > app/build.gradle <<'FILE_0_END'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mushka.colorclicker'
              compileSdk 34

              defaultConfig {
                  applicationId "com.mushka.colorclicker"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }
          FILE_0_END
          cat > build.gradle <<'FILE_1_END'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          FILE_1_END
          cat > gradle.properties <<'FILE_2_END'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          FILE_2_END
          cat > settings.gradle <<'FILE_3_END'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ColorClicker"
          include ':app'
          FILE_3_END
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'FILE_4_END'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="Цвет-кликер"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".RulesActivity"
                      android:exported="false" />

                  <activity
                      android:name=".RuleEditActivity"
                      android:exported="false"
                      android:windowSoftInputMode="adjustResize" />

                  <service
                      android:name=".ClickerService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />

                  <service
                      android:name=".TapService"
                      android:exported="true"
                      android:label="Цвет-кликер"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/tap_service" />
                  </service>
              </application>
          </manifest>
          FILE_4_END
          mkdir -p app/src/main/java/com/mushka/colorclicker
          cat > app/src/main/java/com/mushka/colorclicker/ClickerService.java <<'FILE_5_END'
          package com.mushka.colorclicker;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ServiceInfo;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.PixelFormat;
          import android.graphics.Rect;
          import android.graphics.drawable.GradientDrawable;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.media.Image;
          import android.media.ImageReader;
          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.SystemClock;
          import android.util.DisplayMetrics;
          import android.view.Display;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.nio.ByteBuffer;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.List;

          public class ClickerService extends Service {
              static volatile ClickerService inst;
              private static final int STEP = 3;
              private static final int CELL = 48;

              private final Handler h = new Handler(Looper.getMainLooper());
              private Store store;
              private SharedPreferences prefs;
              private WindowManager wm;
              private MediaProjection mp;
              private MediaProjection.Callback mpCb;
              private VirtualDisplay vd;
              private ImageReader reader;
              private Image cur;
              private int cw;
              private int ch;
              private int dpi;

              private LinearLayout panel;
              private WindowManager.LayoutParams panelLp;
              private TextView bGo;
              private TextView bInfo;
              private View ovl;
              private PickView pickView;

              private boolean running;
              private boolean executing;
              private boolean newFrame;
              private boolean dirty = true;
              private int taps;
              private List<Rule> rules = new ArrayList<>();
              private boolean[] armed = new boolean[0];
              private boolean[] done = new boolean[0];
              private long[] lastFire = new long[0];
              private long[] lastSeen = new long[0];
              private long[] lastRefresh = new long[0];
              private int[][] pts;

              private long pkRule = -1;
              private String pkWhat = "new";
              private int pkStep;

              private final SharedPreferences.OnSharedPreferenceChangeListener listener =
                      (sp, key) -> dirty = true;

              @Override
              public IBinder onBind(Intent in) {
                  return null;
              }

              @Override
              public int onStartCommand(Intent in, int flags, int startId) {
                  String act = in == null ? null : in.getAction();
                  if (in == null || "STOP".equals(act)) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  if ("PICK".equals(act) || "REGION".equals(act)) {
                      if (mp != null && ovl == null) {
                          pkRule = in.getLongExtra("rule", -1);
                          String w = in.getStringExtra("what");
                          pkWhat = w == null ? "color" : w;
                          pkStep = in.getIntExtra("step", 0);
                          if ("REGION".equals(act)) {
                              startRegion();
                          } else {
                              startPick(600);
                          }
                      }
                      return START_NOT_STICKY;
                  }
                  if (mp != null) {
                      return START_NOT_STICKY;
                  }
                  store = new Store(this);
                  prefs = store.prefs();
                  prefs.registerOnSharedPreferenceChangeListener(listener);
                  startFg();
                  MediaProjectionManager m = (MediaProjectionManager) getSystemService(MEDIA_PROJECTION_SERVICE);
                  mp = m.getMediaProjection(in.getIntExtra("code", 0), (Intent) in.getParcelableExtra("data"));
                  if (mp == null) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  mpCb = new MediaProjection.Callback() {
                      @Override
                      public void onStop() {
                          stopSelf();
                      }
                  };
                  mp.registerCallback(mpCb, h);
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  makeDisplay();
                  showPanel();
                  inst = this;
                  return START_NOT_STICKY;
              }

              private void startFg() {
                  NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  nm.createNotificationChannel(new NotificationChannel("cc", "Цвет-кликер", NotificationManager.IMPORTANCE_LOW));
                  Intent stop = new Intent(this, ClickerService.class).setAction("STOP");
                  PendingIntent pi = PendingIntent.getService(this, 1, stop, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Notification n = new Notification.Builder(this, "cc")
                          .setSmallIcon(android.R.drawable.ic_menu_search)
                          .setContentTitle("Цвет-кликер работает")
                          .setContentText("Нажми «Остановить», чтобы выключить")
                          .addAction(new Notification.Action.Builder(android.R.drawable.ic_menu_close_clear_cancel, "Остановить", pi).build())
                          .setOngoing(true)
                          .build();
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION);
                  } else {
                      startForeground(1, n);
                  }
              }

              // ---------- захват экрана ----------
              private DisplayMetrics realMetrics() {
                  DisplayMetrics dm = new DisplayMetrics();
                  DisplayManager dmg = (DisplayManager) getSystemService(Context.DISPLAY_SERVICE);
                  dmg.getDisplay(Display.DEFAULT_DISPLAY).getRealMetrics(dm);
                  return dm;
              }

              private void makeDisplay() {
                  DisplayMetrics dm = realMetrics();
                  cw = dm.widthPixels;
                  ch = dm.heightPixels;
                  dpi = dm.densityDpi;
                  reader = ImageReader.newInstance(cw, ch, PixelFormat.RGBA_8888, 2);
                  vd = mp.createVirtualDisplay("cap", cw, ch, dpi, DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                          reader.getSurface(), null, h);
              }

              // экран мог повернуться: подгоняем размер захвата
              private void fitDisplay() {
                  DisplayMetrics dm = realMetrics();
                  if (dm.widthPixels == cw && dm.heightPixels == ch) {
                      return;
                  }
                  cw = dm.widthPixels;
                  ch = dm.heightPixels;
                  if (cur != null) {
                      cur.close();
                      cur = null;
                  }
                  ImageReader old = reader;
                  reader = ImageReader.newInstance(cw, ch, PixelFormat.RGBA_8888, 2);
                  vd.resize(cw, ch, dpi);
                  vd.setSurface(reader.getSurface());
                  old.close();
                  pts = null;
              }

              // последний кадр; удерживаем его, чтобы он был доступен даже на неподвижном экране
              private Image frame() {
                  Image n = reader.acquireLatestImage();
                  if (n != null) {
                      if (cur != null) {
                          cur.close();
                      }
                      cur = n;
                      newFrame = true;
                  }
                  return cur;
              }

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              private void toast(String s) {
                  Toast.makeText(this, s, Toast.LENGTH_SHORT).show();
              }

              private WindowManager.LayoutParams params(int w, int hh) {
                  WindowManager.LayoutParams lp = new WindowManager.LayoutParams(w, hh,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                  | WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT);
                  lp.gravity = Gravity.TOP | Gravity.START;
                  if (Build.VERSION.SDK_INT >= 30) {
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS;
                  } else if (Build.VERSION.SDK_INT >= 28) {
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  }
                  return lp;
              }

              // ---------- плавающая панель ----------
              private TextView btn(String text) {
                  TextView t = new TextView(this);
                  t.setText(text);
                  t.setTextColor(Color.WHITE);
                  t.setTextSize(14);
                  t.setPadding(dp(10), dp(8), dp(10), dp(8));
                  return t;
              }

              private void showPanel() {
                  panel = new LinearLayout(this);
                  panel.setOrientation(LinearLayout.HORIZONTAL);
                  panel.setGravity(Gravity.CENTER_VERTICAL);
                  panel.setPadding(dp(6), dp(4), dp(6), dp(4));
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(0xEE171A2C);
                  g.setCornerRadius(dp(22));
                  g.setStroke(dp(1), 0x556C8CFF);
                  panel.setBackground(g);

                  TextView handle = btn("≡");
                  bInfo = btn("готов");
                  TextView bPick = btn("Пипетка");
                  TextView bRules = btn("Правила");
                  bGo = btn("Старт");
                  TextView bX = btn("✕");
                  panel.addView(handle);
                  panel.addView(bInfo);
                  panel.addView(bPick);
                  panel.addView(bRules);
                  panel.addView(bGo);
                  panel.addView(bX);

                  bPick.setOnClickListener(v -> {
                      pkRule = -1;
                      pkWhat = "new";
                      startPick(250);
                  });
                  bRules.setOnClickListener(v -> {
                      Intent i = new Intent(this, RulesActivity.class);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(i);
                  });
                  bGo.setOnClickListener(v -> toggle());
                  bX.setOnClickListener(v -> stopSelf());

                  panelLp = params(WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT);
                  panelLp.x = dp(12);
                  panelLp.y = dp(80);
                  handle.setOnTouchListener(new View.OnTouchListener() {
                      float dx;
                      float dy;

                      @Override
                      public boolean onTouch(View v, MotionEvent e) {
                          switch (e.getAction()) {
                              case MotionEvent.ACTION_DOWN:
                                  dx = e.getRawX() - panelLp.x;
                                  dy = e.getRawY() - panelLp.y;
                                  return true;
                              case MotionEvent.ACTION_MOVE:
                                  panelLp.x = (int) (e.getRawX() - dx);
                                  panelLp.y = (int) (e.getRawY() - dy);
                                  wm.updateViewLayout(panel, panelLp);
                                  return true;
                              default:
                                  return true;
                          }
                      }
                  });
                  wm.addView(panel, panelLp);
              }

              private void refresh() {
                  bGo.setText(running ? "Стоп" : "Старт");
                  bInfo.setText(running ? taps + " нажатий" : "готов");
              }

              // ---------- слежение ----------
              private void reload() {
                  rules = store.load();
                  int n = rules.size();
                  armed = new boolean[n];
                  done = new boolean[n];
                  lastFire = new long[n];
                  lastSeen = new long[n];
                  lastRefresh = new long[n];
                  Arrays.fill(armed, true);
                  Arrays.fill(lastSeen, SystemClock.uptimeMillis());
                  pts = null;
                  dirty = false;
              }

              private void toggle() {
                  if (running) {
                      running = false;
                      executing = false;
                  } else {
                      if (TapService.inst == null) {
                          toast("Включи службу доступности «Цвет-кликер»");
                          return;
                      }
                      reload();
                      boolean any = false;
                      for (Rule r : rules) {
                          if (r.active()) {
                              any = true;
                          }
                      }
                      if (!any) {
                          toast("Нет включённых правил с шагами. Добавь цвет пипеткой");
                          return;
                      }
                      taps = 0;
                      running = true;
                      h.post(scan);
                  }
                  refresh();
              }

              private final Runnable scan = new Runnable() {
                  @Override
                  public void run() {
                      if (!running) {
                          return;
                      }
                      try {
                          tick();
                      } catch (Exception ignored) {
                      }
                      h.postDelayed(this, Math.max(30, store.scanInterval()));
                  }
              };

              private void tick() {
                  if (executing || ovl != null) {
                      return;
                  }
                  if (dirty) {
                      reload();
                  }
                  fitDisplay();
                  Image img = frame();
                  if (img == null) {
                      return;
                  }
                  if (newFrame || pts == null) {
                      pts = find(img);
                      newFrame = false;
                  }
                  long now = SystemClock.uptimeMillis();
                  int fire = -1;
                  for (int i = 0; i < rules.size(); i++) {
                      Rule r = rules.get(i);
                      if (!r.active()) {
                          continue;
                      }
                      if (pts[i] == null) {
                          armed[i] = true;
                          continue;
                      }
                      lastSeen[i] = now; // цель видна: таймер автообновления сбрасывается
                      if (fire >= 0) {
                          continue;
                      }
                      boolean ok;
                      if (r.mode == Rule.MODE_INTERVAL) {
                          ok = now - lastFire[i] >= Math.max(100, r.interval);
                      } else if (r.mode == Rule.MODE_ONCE) {
                          ok = !done[i];
                      } else {
                          ok = armed[i];
                      }
                      if (ok) {
                          fire = i;
                      }
                  }
                  if (fire >= 0) {
                      armed[fire] = false;
                      done[fire] = true;
                      lastFire[fire] = now;
                      runChain(rules.get(fire), pts[fire]);
                      return;
                  }
                  // автообновление: целей нет refreshDelay мс подряд -> нажать «Обновить» (не чаще refreshDelay)
                  for (int i = 0; i < rules.size(); i++) {
                      Rule r = rules.get(i);
                      if (!r.active() || !r.autoRefresh || !r.hasRefreshPoint() || pts[i] != null) {
                          continue;
                      }
                      int d = Math.max(300, r.refreshDelay);
                      if (now - lastSeen[i] >= d && now - lastRefresh[i] >= d) {
                          TapService.tap(Math.min(cw - 1, r.refreshX), Math.min(ch - 1, r.refreshY));
                          lastRefresh[i] = now;
                          lastSeen[i] = now; // сброс таймера
                          taps++;
                          refresh();
                          break;
                      }
                  }
              }

              private void runChain(final Rule r, final int[] colorPt) {
                  executing = true;
                  h.post(new Runnable() {
                      int i = 0;

                      @Override
                      public void run() {
                          if (!running || i >= r.steps.size()) {
                              executing = false;
                              refresh();
                              return;
                          }
                          Step s = r.steps.get(i);
                          i++;
                          int x;
                          int y;
                          switch (s.type) {
                              case 1:
                                  x = s.x;
                                  y = s.y;
                                  break;
                              case 2:
                                  x = s.x;
                                  y = colorPt[1];
                                  break;
                              case 3:
                                  x = colorPt[0] + s.x;
                                  y = colorPt[1] + s.y;
                                  break;
                              default:
                                  x = colorPt[0];
                                  y = colorPt[1];
                          }
                          x = Math.max(0, Math.min(cw - 1, x));
                          y = Math.max(0, Math.min(ch - 1, y));
                          TapService.tap(x, y);
                          taps++;
                          refresh();
                          h.postDelayed(this, Math.max(30, s.delay));
                      }
                  });
              }

              // Один проход по кадру сразу для всех правил.
              // 1) пиксель подходит, если он близок (допуск tol) к ЛЮБОМУ цвету правила;
              // 2) подходящие пиксели склеиваются в кластеры (отдельные наклейки);
              // 3) кластеры группируются по строкам (по Y);
              // 4) строка пропускается, если requiredStickers > 0 и кластеров в ней не столько;
              // 5) результат: точка нажатия (X кнопки, Y центра строки) или null.
              private int[][] find(Image img) {
                  Image.Plane pl = img.getPlanes()[0];
                  ByteBuffer b = pl.getBuffer();
                  int ps = pl.getPixelStride();
                  int rs = pl.getRowStride();
                  int w = img.getWidth();
                  int hh = img.getHeight();
                  int n = rules.size();
                  int gw = (w + STEP - 1) / STEP;
                  int gh = (hh + STEP - 1) / STEP;

                  int na = 0;
                  int[] act = new int[n];
                  for (int k = 0; k < n; k++) {
                      if (rules.get(k).active()) {
                          act[na++] = k;
                      }
                  }
                  int[][] cr = new int[na][];
                  int[][] cg = new int[na][];
                  int[][] cb = new int[na][];
                  int[] tol = new int[na];
                  int[] rl = new int[na];
                  int[] rt = new int[na];
                  int[] rr = new int[na];
                  int[] rb = new int[na];
                  boolean[] reg = new boolean[na];
                  boolean[][] mask = new boolean[na][];
                  for (int a = 0; a < na; a++) {
                      Rule r = rules.get(act[a]);
                      int m = r.colors.size();
                      cr[a] = new int[m];
                      cg[a] = new int[m];
                      cb[a] = new int[m];
                      for (int j = 0; j < m; j++) {
                          int c = r.colors.get(j);
                          cr[a][j] = Color.red(c);
                          cg[a][j] = Color.green(c);
                          cb[a][j] = Color.blue(c);
                      }
                      tol[a] = r.tol;
                      reg[a] = r.hasRegion();
                      rl[a] = r.rl;
                      rt[a] = r.rt;
                      rr[a] = r.rr;
                      rb[a] = r.rb;
                      mask[a] = new boolean[gw * gh];
                  }
                  Rect ex = null;
                  if (panel != null) {
                      ex = new Rect(panelLp.x - dp(4), panelLp.y - dp(4),
                              panelLp.x + panel.getWidth() + dp(4), panelLp.y + panel.getHeight() + dp(4));
                  }
                  for (int y = 0, iy = 0; y < hh; y += STEP, iy++) {
                      for (int x = 0, ix = 0; x < w; x += STEP, ix++) {
                          if (ex != null && ex.contains(x, y)) {
                              continue;
                          }
                          int o = y * rs + x * ps;
                          int pr = b.get(o) & 0xFF;
                          int pg = b.get(o + 1) & 0xFF;
                          int pb = b.get(o + 2) & 0xFF;
                          for (int a = 0; a < na; a++) {
                              if (reg[a] && (x < rl[a] || x >= rr[a] || y < rt[a] || y >= rb[a])) {
                                  continue;
                              }
                              int t = tol[a];
                              for (int j = 0; j < cr[a].length; j++) {
                                  if (Math.abs(pr - cr[a][j]) <= t && Math.abs(pg - cg[a][j]) <= t
                                          && Math.abs(pb - cb[a][j]) <= t) {
                                      mask[a][iy * gw + ix] = true;
                                      break;
                                  }
                              }
                          }
                      }
                  }
                  int[][] res = new int[n][];
                  int[] queue = new int[gw * gh];
                  for (int a = 0; a < na; a++) {
                      res[act[a]] = findRow(rules.get(act[a]), mask[a], gw, gh, queue, dp(18));
                  }
                  return res;
              }

              // кластеры -> строки -> выбор строки; координаты считаются в пикселях экрана
              private int[] findRow(Rule r, boolean[] mask, int gw, int gh, int[] queue, int rowTol) {
                  List<int[]> clusters = new ArrayList<>(); // {cx, cy, count}
                  for (int i = 0; i < mask.length; i++) {
                      if (!mask[i]) {
                          continue;
                      }
                      int qh = 0;
                      int qt = 0;
                      queue[qt++] = i;
                      mask[i] = false;
                      long sx = 0;
                      long sy = 0;
                      int cnt = 0;
                      while (qh < qt) {
                          int c = queue[qh++];
                          int cy = c / gw;
                          int cx = c % gw;
                          cnt++;
                          sx += cx * STEP;
                          sy += cy * STEP;
                          // соседи в радиусе 2 пробы: небольшие щели внутри наклейки не разрывают её
                          for (int dy = -2; dy <= 2; dy++) {
                              int ny = cy + dy;
                              if (ny < 0 || ny >= gh) {
                                  continue;
                              }
                              for (int dx = -2; dx <= 2; dx++) {
                                  int nx = cx + dx;
                                  if (nx < 0 || nx >= gw) {
                                      continue;
                                  }
                                  int ni = ny * gw + nx;
                                  if (mask[ni]) {
                                      mask[ni] = false;
                                      queue[qt++] = ni;
                                  }
                              }
                          }
                      }
                      if (cnt >= r.minSize) {
                          clusters.add(new int[]{(int) (sx / cnt), (int) (sy / cnt), cnt});
                      }
                  }
                  if (clusters.isEmpty()) {
                      return null;
                  }
                  Collections.sort(clusters, new Comparator<int[]>() {
                      @Override
                      public int compare(int[] p, int[] q) {
                          return Integer.compare(p[1], q[1]);
                      }
                  });

                  // X кнопки: из первого шага «По строке (X)», иначе середина наклеек строки
                  int buttonX = -1;
                  for (Step st : r.steps) {
                      if (st.type == 2) {
                          buttonX = st.x;
                          break;
                      }
                  }

                  boolean have = false;
                  int bestTot = 0;
                  int bx = 0;
                  int by = 0;
                  int i = 0;
                  while (i < clusters.size()) {
                      long sumY = 0;
                      long sumX = 0;
                      int num = 0;
                      int tot = 0;
                      int j = i;
                      while (j < clusters.size()) {
                          int[] c = clusters.get(j);
                          if (num > 0 && Math.abs(c[1] - sumY / num) > rowTol) {
                              break;
                          }
                          sumX += c[0];
                          sumY += c[1];
                          tot += c[2];
                          num++;
                          j++;
                      }
                      i = j;
                      if (r.requiredStickers > 0 && num != r.requiredStickers) {
                          continue; // в строке не то число наклеек
                      }
                      int rowY = (int) (sumY / num);
                      int rowX = buttonX >= 0 ? buttonX : (int) (sumX / num);
                      boolean better;
                      if (!have) {
                          better = true;
                      } else if (r.pick == 1) {
                          better = rowY < by;
                      } else if (r.pick == 2) {
                          better = rowY > by;
                      } else {
                          better = tot > bestTot;
                      }
                      if (better) {
                          have = true;
                          bestTot = tot;
                          bx = rowX;
                          by = rowY;
                      }
                  }
                  return have ? new int[]{bx, by} : null;
              }

              // ---------- пипетка ----------
              private void startPick(int delay) {
                  if (ovl != null) {
                      return;
                  }
                  panel.setVisibility(View.INVISIBLE);
                  ovl = new View(this);
                  h.postDelayed(() -> grabForPick(0), delay);
              }

              private void cancelTool(String msg) {
                  ovl = null;
                  panel.setVisibility(View.VISIBLE);
                  toast(msg);
                  if (pkRule >= 0) {
                      reopenEditor();
                  }
                  pkRule = -1;
              }

              private void grabForPick(final int n) {
                  try {
                      fitDisplay();
                  } catch (Exception ignored) {
                  }
                  Image img = frame();
                  if (img == null) {
                      if (n < 12) {
                          h.postDelayed(() -> grabForPick(n + 1), 120);
                      } else {
                          cancelTool("Не удалось сделать снимок экрана");
                      }
                      return;
                  }
                  Image.Plane pl = img.getPlanes()[0];
                  Bitmap full = Bitmap.createBitmap(pl.getRowStride() / pl.getPixelStride(), img.getHeight(), Bitmap.Config.ARGB_8888);
                  full.copyPixelsFromBuffer(pl.getBuffer());
                  Bitmap shot = Bitmap.createBitmap(full, 0, 0, img.getWidth(), img.getHeight());
                  if (shot != full) {
                      full.recycle();
                  }
                  pickView = new PickView(this, shot);
                  ovl = pickView;
                  wm.addView(pickView, params(WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT));
              }

              private void finishPick(boolean ok) {
                  PickView pv = pickView;
                  int x = (int) pv.px;
                  int y = (int) pv.py;
                  int col = ok ? (pv.pix(x, y) | 0xFF000000) : 0;
                  wm.removeView(pv);
                  pv.shot.recycle();
                  pickView = null;
                  ovl = null;
                  panel.setVisibility(View.VISIBLE);
                  if (ok) {
                      applyPick(col, x, y);
                  } else if (pkRule >= 0) {
                      reopenEditor();
                  }
                  if (!ok) {
                      pkRule = -1;
                  }
              }

              private void applyPick(int col, int x, int y) {
                  List<Rule> l = store.load();
                  Rule r = store.find(l, pkRule);
                  if (pkRule < 0 || r == null) {
                      r = new Rule();
                      r.colors.clear();
                      r.colors.add(col);
                      r.name = String.format("Цвет #%06X", col & 0xFFFFFF);
                      r.steps.add(new Step());
                      l.add(r);
                      toast("Добавлено правило «" + r.name + "». Настройка: кнопка «Правила»");
                  } else if ("point".equals(pkWhat)) {
                      if (pkStep >= 0 && pkStep < r.steps.size()) {
                          Step s = r.steps.get(pkStep);
                          if (s.type == 2) {
                              s.x = x;
                          } else {
                              s.type = 1;
                              s.x = x;
                              s.y = y;
                          }
                          toast("Точка сохранена: " + x + ", " + y);
                      }
                  } else if ("refresh".equals(pkWhat)) {
                      r.refreshX = x;
                      r.refreshY = y;
                      toast("Кнопка «Обновить»: " + x + ", " + y);
                  } else {
                      if (!r.colors.contains(col)) {
                          r.colors.add(col);
                      }
                      toast(String.format("Цвет добавлен: #%06X", col & 0xFFFFFF));
                  }
                  store.save(l);
                  if (pkRule >= 0) {
                      reopenEditor();
                  }
                  pkRule = -1;
              }

              private void reopenEditor() {
                  Intent i = new Intent(this, RuleEditActivity.class);
                  i.putExtra("id", pkRule);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  startActivity(i);
              }

              private class PickView extends View {
                  final Bitmap shot;
                  final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  float px;
                  float py;
                  boolean has;

                  PickView(Context c, Bitmap s) {
                      super(c);
                      shot = s;
                      p.setTextSize(dp(15));
                  }

                  int pix(int x, int y) {
                      x = Math.max(0, Math.min(shot.getWidth() - 1, x));
                      y = Math.max(0, Math.min(shot.getHeight() - 1, y));
                      return shot.getPixel(x, y);
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      int[] o = new int[2];
                      getLocationOnScreen(o);
                      c.drawBitmap(shot, -o[0], -o[1], null);
                      int w = getWidth();
                      int hh = getHeight();
                      int bh = dp(64);
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(0xAA000000);
                      c.drawRect(0, 0, w, dp(40), p);
                      p.setColor(Color.WHITE);
                      c.drawText("Проведи пальцем по нужному месту", dp(12), dp(26), p);
                      p.setColor(0xEE171A2C);
                      c.drawRect(0, hh - bh, w, hh, p);
                      p.setColor(Color.WHITE);
                      c.drawText("Отмена", dp(24), hh - bh / 2f + dp(5), p);
                      if (!has) {
                          return;
                      }
                      float vx = px - o[0];
                      float vy = py - o[1];
                      int col = pix((int) px, (int) py) | 0xFF000000;
                      int cell = dp(9);
                      int n = 11;
                      int size = cell * n;
                      float lx = Math.max(dp(8), Math.min(w - size - dp(8), vx - size / 2f));
                      float ly = vy - dp(44) - size;
                      if (ly < dp(48)) {
                          ly = vy + dp(44);
                      }
                      for (int i = 0; i < n; i++) {
                          for (int j = 0; j < n; j++) {
                              p.setStyle(Paint.Style.FILL);
                              p.setColor(pix((int) px + i - 5, (int) py + j - 5) | 0xFF000000);
                              c.drawRect(lx + i * cell, ly + j * cell, lx + (i + 1) * cell, ly + (j + 1) * cell, p);
                          }
                      }
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(dp(2));
                      p.setColor(Color.WHITE);
                      c.drawRect(lx, ly, lx + size, ly + size, p);
                      p.setColor(Color.BLACK);
                      c.drawRect(lx + 5 * cell, ly + 5 * cell, lx + 6 * cell, ly + 6 * cell, p);
                      p.setColor(Color.WHITE);
                      c.drawCircle(vx, vy, dp(14), p);
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(col);
                      c.drawRect(w / 2f, hh - bh, w, hh, p);
                      p.setColor(Ui.isLight(col) ? Color.BLACK : Color.WHITE);
                      c.drawText(String.format("Выбрать #%06X", col & 0xFFFFFF), w / 2f + dp(16), hh - bh / 2f + dp(5), p);
                  }

                  @Override
                  public boolean onTouchEvent(MotionEvent e) {
                      float rx = e.getRawX();
                      float ry = e.getRawY();
                      boolean inBtn = ry > ch - dp(64);
                      switch (e.getAction()) {
                          case MotionEvent.ACTION_DOWN:
                          case MotionEvent.ACTION_MOVE:
                              if (!inBtn) {
                                  px = rx;
                                  py = ry;
                                  has = true;
                                  invalidate();
                              }
                              return true;
                          case MotionEvent.ACTION_UP:
                              if (inBtn) {
                                  if (rx < cw / 2f) {
                                      finishPick(false);
                                  } else if (has) {
                                      finishPick(true);
                                  }
                              }
                              return true;
                          default:
                              return true;
                      }
                  }
              }

              // ---------- область поиска (только из редактора правила) ----------
              private void startRegion() {
                  if (ovl != null || pkRule < 0) {
                      return;
                  }
                  panel.setVisibility(View.INVISIBLE);
                  ovl = new RegView(this);
                  wm.addView(ovl, params(WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT));
              }

              private void endRegion(Rect rc) {
                  wm.removeView(ovl);
                  ovl = null;
                  panel.setVisibility(View.VISIBLE);
                  if (rc.width() >= dp(24) && rc.height() >= dp(24)) {
                      List<Rule> l = store.load();
                      Rule r = store.find(l, pkRule);
                      if (r != null) {
                          r.rl = rc.left;
                          r.rt = rc.top;
                          r.rr = rc.right;
                          r.rb = rc.bottom;
                          store.save(l);
                          toast("Область сохранена");
                      }
                  }
                  reopenEditor();
                  pkRule = -1;
              }

              private class RegView extends View {
                  final Paint dim = new Paint();
                  final Paint line = new Paint();
                  final Paint txt = new Paint();
                  float x0;
                  float y0;
                  float x1;
                  float y1;
                  boolean has;

                  RegView(Context c) {
                      super(c);
                      dim.setColor(0x88000000);
                      line.setColor(0xFF6C8CFF);
                      line.setStyle(Paint.Style.STROKE);
                      line.setStrokeWidth(dp(2));
                      txt.setColor(Color.WHITE);
                      txt.setTextSize(dp(16));
                      txt.setAntiAlias(true);
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      int[] o = new int[2];
                      getLocationOnScreen(o);
                      int w = getWidth();
                      int hh = getHeight();
                      if (!has) {
                          c.drawRect(0, 0, w, hh, dim);
                          c.drawText("Выдели область, где искать цвет", dp(24), dp(80), txt);
                          return;
                      }
                      float l = Math.min(x0, x1) - o[0];
                      float r = Math.max(x0, x1) - o[0];
                      float t = Math.min(y0, y1) - o[1];
                      float b = Math.max(y0, y1) - o[1];
                      c.drawRect(0, 0, w, t, dim);
                      c.drawRect(0, b, w, hh, dim);
                      c.drawRect(0, t, l, b, dim);
                      c.drawRect(r, t, w, b, dim);
                      c.drawRect(l, t, r, b, line);
                  }

                  @Override
                  public boolean onTouchEvent(MotionEvent e) {
                      switch (e.getAction()) {
                          case MotionEvent.ACTION_DOWN:
                              x0 = e.getRawX();
                              x1 = x0;
                              y0 = e.getRawY();
                              y1 = y0;
                              has = true;
                              invalidate();
                              return true;
                          case MotionEvent.ACTION_MOVE:
                              x1 = e.getRawX();
                              y1 = e.getRawY();
                              invalidate();
                              return true;
                          case MotionEvent.ACTION_UP:
                              x1 = e.getRawX();
                              y1 = e.getRawY();
                              endRegion(new Rect((int) Math.min(x0, x1), (int) Math.min(y0, y1),
                                      (int) Math.max(x0, x1), (int) Math.max(y0, y1)));
                              return true;
                          default:
                              return true;
                      }
                  }
              }

              @Override
              public void onDestroy() {
                  inst = null;
                  running = false;
                  h.removeCallbacksAndMessages(null);
                  if (prefs != null) {
                      prefs.unregisterOnSharedPreferenceChangeListener(listener);
                  }
                  try {
                      if (ovl != null && ovl.getParent() != null) {
                          wm.removeView(ovl);
                      }
                  } catch (Exception ignored) {
                  }
                  try {
                      if (panel != null) {
                          wm.removeView(panel);
                      }
                  } catch (Exception ignored) {
                  }
                  if (cur != null) {
                      cur.close();
                  }
                  if (vd != null) {
                      vd.release();
                  }
                  if (reader != null) {
                      reader.close();
                  }
                  if (mp != null) {
                      try {
                          mp.unregisterCallback(mpCb);
                          mp.stop();
                      } catch (Exception ignored) {
                      }
                  }
                  super.onDestroy();
              }
          }
