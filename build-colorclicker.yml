              private boolean load() {
                  rules = store.load();
                  rule = store.find(rules, id);
                  return rule != null;
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  id = intent.getLongExtra("id", id);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (!built) {
                      return;
                  }
                  if (load()) {
                      fill();
                  } else {
                      finish();
                  }
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  persist();
              }

              private void fill() {
                  nameEt.setText(rule.name);
                  intervalEt.setText(String.valueOf(rule.interval));
                  stickersEt.setText(String.valueOf(rule.requiredStickers));
                  tolBar.setProgress(rule.tol);
                  minBar.setProgress(Math.max(0, rule.minSize - 3));
                  autoCb.setChecked(rule.autoRefresh);
                  refreshXEt.setText(rule.refreshX < 0 ? "" : String.valueOf(rule.refreshX));
                  refreshYEt.setText(rule.refreshY < 0 ? "" : String.valueOf(rule.refreshY));
                  refreshDelayEt.setText(String.valueOf(rule.refreshDelay));
                  refreshLabels();
                  rebuildColors();
                  rebuildSteps();
              }

              private void refreshLabels() {
                  tolLabel.setText("Допуск цвета: " + rule.tol + " (больше, значит менее строго)");
                  regionLabel.setText(rule.hasRegion()
                          ? "Область: " + rule.rl + "," + rule.rt + " до " + rule.rr + "," + rule.rb
                          : "Область: весь экран");
                  modeBtn.setText("Повтор: " + MODE_NAMES[Math.max(0, Math.min(2, rule.mode))]);
                  pickBtn.setText("Если подходящих строк несколько, нажимать на " + PICK_NAMES[Math.max(0, Math.min(2, rule.pick))]);
                  minLabel.setText(minText(rule.minSize));
                  int vis = rule.mode == Rule.MODE_INTERVAL ? View.VISIBLE : View.GONE;
                  intervalLabel.setVisibility(vis);
                  intervalEt.setVisibility(vis);
              }

              private String minText(int n) {
                  int side = (int) Math.round(3 * Math.sqrt(n));
                  return "Минимальный размер одной наклейки: " + n + " (около " + side + "×" + side
                          + " пикселей). Всё мельче считается мусором";
              }

              private int num(EditText e, int def) {
                  try {
                      return Integer.parseInt(e.getText().toString().trim());
                  } catch (Exception ex) {
                      return def;
                  }
              }

              // читает значения из полей шагов в объект правила
              private void collect() {
                  for (int i = 0; i < rule.steps.size() && i < eds.size(); i++) {
                      Step s = rule.steps.get(i);
                      s.delay = Math.max(30, num(eds.get(i), s.delay));
                      if (s.type == 1 || s.type == 3) {
                          s.x = num(exs.get(i), s.x);
                          s.y = num(eys.get(i), s.y);
                      } else if (s.type == 2) {
                          s.x = num(exs.get(i), s.x);
                      }
                  }
              }

              private void persist() {
                  if (!built || rule == null) {
                      return;
                  }
                  collect();
                  String n = nameEt.getText().toString().trim();
                  rule.name = n.isEmpty() ? "Правило" : n;
                  rule.interval = Math.max(100, num(intervalEt, rule.interval));
                  rule.requiredStickers = Math.max(0, num(stickersEt, 0));
                  rule.autoRefresh = autoCb.isChecked();
                  rule.refreshX = num(refreshXEt, -1);
                  rule.refreshY = num(refreshYEt, -1);
                  rule.refreshDelay = Math.max(300, num(refreshDelayEt, 2000));
                  store.save(rules);
              }

              private void startTool(String action, String what, int step) {
                  if (ClickerService.inst == null) {
                      Toast.makeText(this, "Сначала запусти панель кнопкой «Запустить» на главном экране", Toast.LENGTH_LONG).show();
                      return;
                  }
                  persist();
                  Intent i = new Intent(this, ClickerService.class);
                  i.setAction(action);
                  i.putExtra("rule", rule.id);
                  i.putExtra("what", what);
                  i.putExtra("step", step);
                  startService(i);
                  moveTaskToBack(true);
              }

              private void hexDialog() {
                  AlertDialog.Builder b = new AlertDialog.Builder(this);
                  b.setTitle("Цвет в HEX (RRGGBB)");
                  final EditText e = new EditText(this);
                  e.setText("FF0000");
                  b.setView(e);
                  b.setPositiveButton("Добавить", (d, w) -> {
                      try {
                          String t = e.getText().toString().trim().replace("#", "");
                          int c = 0xFF000000 | (int) Long.parseLong(t, 16);
                          if (!rule.colors.contains(c)) {
                              rule.colors.add(c);
                          }
                          rebuildColors();
                      } catch (Exception ignored) {
                      }
                  });
                  b.setNegativeButton("Отмена", null);
                  b.show();
              }

              private int dp(int v) {
                  return Ui.dp(this, v);
              }

              private void rebuildColors() {
                  colorsBox.removeAllViews();
                  if (rule.colors.isEmpty()) {
                      colorsBox.addView(Ui.text(this, "Цветов нет: правило не работает. Добавь хотя бы один.", 13));
                  }
                  for (int i = 0; i < rule.colors.size(); i++) {
                      final int ci = i;
                      int c = rule.colors.get(i);
                      LinearLayout row = new LinearLayout(this);
                      row.setOrientation(LinearLayout.HORIZONTAL);
                      row.setGravity(Gravity.CENTER_VERTICAL);
                      View sw = new View(this);
                      sw.setBackgroundColor(c | 0xFF000000);
                      sw.setLayoutParams(new LinearLayout.LayoutParams(dp(28), dp(28)));
                      row.addView(sw);
                      TextView t = Ui.text(this, "  " + String.format("#%06X", c & 0xFFFFFF), 16);
                      t.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1));
                      row.addView(t);
                      Button del = Ui.button(this, "✕");
                      del.setOnClickListener(v -> {
                          rule.colors.remove(ci);
                          rebuildColors();
                      });
                      row.addView(del);
                      colorsBox.addView(row);
                  }
              }

              private void rebuildSteps() {
                  stepsBox.removeAllViews();
                  exs.clear();
                  eys.clear();
                  eds.clear();
                  for (int i = 0; i < rule.steps.size(); i++) {
                      final int si = i;
                      final Step s = rule.steps.get(i);
                      LinearLayout col = new LinearLayout(this);
                      col.setOrientation(LinearLayout.VERTICAL);
                      col.setPadding(0, dp(8), 0, dp(8));

                      LinearLayout head = new LinearLayout(this);
                      head.setOrientation(LinearLayout.HORIZONTAL);
                      head.setGravity(Gravity.CENTER_VERTICAL);
                      TextView t = Ui.text(this, "Шаг " + (i + 1), 15);
                      t.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1));
                      head.addView(t);
                      Button type = Ui.button(this, TYPE_NAMES[Math.max(0, Math.min(3, s.type))]);
                      type.setOnClickListener(v -> {
                          collect();
                          int nt = (s.type + 1) % 4;
                          if (nt == 3) {
                              s.x = 0;
                              s.y = 0;
                          } else if (s.type == 3) {
                              s.x = 500;
                              s.y = 1000;
                          }
                          s.type = nt;
                          rebuildSteps();
                      });
                      head.addView(type);
                      Button del = Ui.button(this, "✕");
                      del.setOnClickListener(v -> {
                          collect();
                          rule.steps.remove(si);
                          rebuildSteps();
                      });
                      head.addView(del);
                      col.addView(head);

                      LinearLayout line = new LinearLayout(this);
                      line.setOrientation(LinearLayout.HORIZONTAL);
                      line.setGravity(Gravity.CENTER_VERTICAL);
                      EditText ex = field(s.type == 3 ? "сдвиг X" : (s.type == 2 ? "X кнопки" : "x"), s.x);
                      EditText ey = field(s.type == 3 ? "сдвиг Y" : "y", s.y);
                      EditText ed = field("пауза, мс", s.delay);
                      if (s.type == 1) {
                          line.addView(ex);
                          line.addView(ey);
                          Button take = Ui.button(this, "Взять");
                          take.setOnClickListener(v -> startTool("PICK", "point", si));
                          line.addView(take);
                      } else if (s.type == 2) {
                          line.addView(ex);
                          Button take = Ui.button(this, "Взять");
                          take.setOnClickListener(v -> startTool("PICK", "point", si));
                          line.addView(take);
                      } else if (s.type == 3) {
                          line.addView(ex);
                          line.addView(ey);
                      }
                      line.addView(ed);
                      col.addView(line);
                      stepsBox.addView(col);
                      exs.add(ex);
                      eys.add(ey);
                      eds.add(ed);
                  }
              }

              private EditText field(String hint, int value) {
                  EditText e = new EditText(this);
                  e.setInputType(InputType.TYPE_CLASS_NUMBER | InputType.TYPE_NUMBER_FLAG_SIGNED);
                  e.setTextColor(Color.WHITE);
                  e.setHint(hint);
                  e.setHintTextColor(0xFF777777);
                  e.setText(value < 0 && hint.contains("кнопки") ? "" : String.valueOf(value));
                  e.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1));
                  return e;
              }
          }
