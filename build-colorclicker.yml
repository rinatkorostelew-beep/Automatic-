          package com.mushka.colorclicker;

          import org.json.JSONArray;
          import org.json.JSONException;
          import org.json.JSONObject;

          import java.util.ArrayList;
          import java.util.List;

          public class Rule {
              public static final int MODE_APPEAR = 0;
              public static final int MODE_INTERVAL = 1;
              public static final int MODE_ONCE = 2;
              public static final int DEFAULT_COLOR = 0xFFFF0000;

              public long id = System.currentTimeMillis();
              public String name = "Правило";
              public boolean enabled = true;

              /** Цвета наклейки: подходит ЛЮБОЙ из списка. */
              public List<Integer> colors = new ArrayList<>();
              public int tol = 25;
              /** Сколько наклеек должно быть в строке: 0 = любое число, N = ровно N. */
              public int requiredStickers = 0;

              public int rl = -1;
              public int rt = -1;
              public int rr = -1;
              public int rb = -1;

              public int mode = MODE_APPEAR;
              public int interval = 500;
              public int pick = 0;      // 0 самая заметная, 1 самая верхняя, 2 самая нижняя
              public int minSize = 3;   // минимальный размер одной наклейки (число совпавших проб)

              /** Автообновление: если целей нет refreshDelay мс, нажать кнопку «Обновить». */
              public boolean autoRefresh = false;
              public int refreshX = -1;
              public int refreshY = -1;
              public int refreshDelay = 2000;

              public List<Step> steps = new ArrayList<>();

              public Rule() {
                  colors.add(DEFAULT_COLOR);
              }

              public int firstColor() {
                  return colors.isEmpty() ? DEFAULT_COLOR : colors.get(0);
              }

              public boolean hasRegion() {
                  return rl >= 0 && rt >= 0 && rr > rl && rb > rt;
              }

              public void clearRegion() {
                  rl = -1;
                  rt = -1;
                  rr = -1;
                  rb = -1;
              }

              public boolean hasRefreshPoint() {
                  return refreshX >= 0 && refreshY >= 0;
              }

              public boolean active() {
                  return enabled && !steps.isEmpty() && !colors.isEmpty();
              }

              public JSONObject toJson() throws JSONException {
                  JSONObject o = new JSONObject();
                  o.put("id", id);
                  o.put("name", name);
                  o.put("on", enabled);
                  JSONArray ca = new JSONArray();
                  for (int c : colors) {
                      ca.put(c);
                  }
                  o.put("colors", ca);
                  if (!colors.isEmpty()) {
                      o.put("color", colors.get(0)); // для совместимости со старыми версиями
                  }
                  o.put("tol", tol);
                  o.put("req", requiredStickers);
                  o.put("rl", rl);
                  o.put("rt", rt);
                  o.put("rr", rr);
                  o.put("rb", rb);
                  o.put("mode", mode);
                  o.put("iv", interval);
                  o.put("pick", pick);
                  o.put("min", minSize);
                  o.put("ar", autoRefresh);
                  o.put("rx", refreshX);
                  o.put("ry", refreshY);
                  o.put("rd", refreshDelay);
                  JSONArray a = new JSONArray();
                  for (Step s : steps) {
                      a.put(s.toJson());
                  }
                  o.put("steps", a);
                  return o;
              }

              public static Rule fromJson(JSONObject o) throws JSONException {
                  Rule r = new Rule();
                  r.id = o.optLong("id", r.id);
                  r.name = o.optString("name", "Правило");
                  r.enabled = o.optBoolean("on", true);

                  r.colors.clear();
                  JSONArray ca = o.optJSONArray("colors");
                  if (ca != null) {
                      for (int i = 0; i < ca.length(); i++) {
                          r.colors.add(ca.optInt(i) | 0xFF000000);
                      }
                  }
                  if (r.colors.isEmpty() && o.has("color")) {
                      r.colors.add(o.optInt("color") | 0xFF000000);
                  }
                  if (r.colors.isEmpty() && !o.has("colors") && !o.has("color")) {
                      r.colors.add(DEFAULT_COLOR);
                  }

                  r.tol = Math.max(0, Math.min(80, o.optInt("tol", 25)));
                  r.requiredStickers = Math.max(0, o.optInt("req", 0));
                  r.rl = o.optInt("rl", -1);
                  r.rt = o.optInt("rt", -1);
                  r.rr = o.optInt("rr", -1);
                  r.rb = o.optInt("rb", -1);
                  r.mode = o.optInt("mode", MODE_APPEAR);
                  r.interval = Math.max(100, o.optInt("iv", 500));
                  r.pick = Math.max(0, Math.min(2, o.optInt("pick", 0)));
                  r.minSize = Math.max(1, o.optInt("min", 3));
                  r.autoRefresh = o.optBoolean("ar", false);
                  r.refreshX = o.optInt("rx", -1);
                  r.refreshY = o.optInt("ry", -1);
                  r.refreshDelay = Math.max(300, o.optInt("rd", 2000));

                  JSONArray a = o.optJSONArray("steps");
                  if (a != null) {
                      for (int i = 0; i < a.length(); i++) {
                          r.steps.add(Step.fromJson(a.getJSONObject(i)));
                      }
                  }
                  return r;
              }
          }
