          package com.mushka.colorclicker;

          import android.content.Context;
          import android.content.SharedPreferences;

          import org.json.JSONArray;

          import java.util.ArrayList;
          import java.util.List;

          public class Store {
              private final SharedPreferences p;

              public Store(Context c) {
                  p = c.getSharedPreferences("cc", Context.MODE_PRIVATE);
              }

              public SharedPreferences prefs() {
                  return p;
              }

              public int scanInterval() {
                  return p.getInt("iv", 100);
              }

              public void setScanInterval(int v) {
                  p.edit().putInt("iv", v).apply();
              }

              public List<Rule> load() {
                  List<Rule> out = new ArrayList<>();
                  try {
                      JSONArray a = new JSONArray(p.getString("rules", "[]"));
                      for (int i = 0; i < a.length(); i++) {
                          out.add(Rule.fromJson(a.getJSONObject(i)));
                      }
                  } catch (Exception ignored) {
                  }
                  return out;
              }

              public void save(List<Rule> list) {
                  try {
                      JSONArray a = new JSONArray();
                      for (Rule r : list) {
                          a.put(r.toJson());
                      }
                      p.edit().putString("rules", a.toString()).apply();
                  } catch (Exception ignored) {
                  }
              }

              public Rule find(List<Rule> list, long id) {
                  for (Rule r : list) {
                      if (r.id == id) {
                          return r;
                      }
                  }
                  return null;
              }

              public String export() {
                  return p.getString("rules", "[]");
              }

              /** Возвращает число загруженных правил или -1, если текст не подошёл. */
              public int importJson(String json) {
                  try {
                      JSONArray a = new JSONArray(json.trim());
                      List<Rule> list = new ArrayList<>();
                      for (int i = 0; i < a.length(); i++) {
                          list.add(Rule.fromJson(a.getJSONObject(i)));
                      }
                      save(list);
                      return list.size();
                  } catch (Exception e) {
                      return -1;
                  }
              }
          }
          FILE_11_END
          mkdir -p app/src/main/java/com/mushka/colorclicker
          cat > app/src/main/java/com/mushka/colorclicker/TapService.java <<'FILE_12_END'
          package com.mushka.colorclicker;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.content.Intent;
          import android.graphics.Path;
          import android.view.accessibility.AccessibilityEvent;

          public class TapService extends AccessibilityService {
              static volatile TapService inst;

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  inst = this;
              }

              @Override
              public boolean onUnbind(Intent intent) {
                  inst = null;
                  return super.onUnbind(intent);
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
              }

              @Override
              public void onInterrupt() {
              }

              static boolean tap(float x, float y) {
                  TapService s = inst;
                  if (s == null) {
                      return false;
                  }
                  Path p = new Path();
                  p.moveTo(x, y);
                  GestureDescription.StrokeDescription st = new GestureDescription.StrokeDescription(p, 0, 40);
                  return s.dispatchGesture(new GestureDescription.Builder().addStroke(st).build(), null, null);
              }
          }
          FILE_12_END
          mkdir -p app/src/main/java/com/mushka/colorclicker
          cat > app/src/main/java/com/mushka/colorclicker/Ui.java <<'FILE_13_END'
          package com.mushka.colorclicker;

          import android.content.Context;
          import android.graphics.Color;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          final class Ui {
              static final int BG = 0xFF0E1020;

              private Ui() {
              }

              static int dp(Context c, int v) {
                  return (int) (v * c.getResources().getDisplayMetrics().density + 0.5f);
              }

              static TextView text(Context c, String s, int sp) {
                  TextView t = new TextView(c);
                  t.setText(s);
                  t.setTextSize(sp);
                  t.setTextColor(Color.WHITE);
                  t.setPadding(0, dp(c, 6), 0, dp(c, 6));
                  return t;
              }

              static Button button(Context c, String s) {
                  Button b = new Button(c);
                  b.setText(s);
                  return b;
              }

              static LinearLayout column(Context c) {
                  LinearLayout l = new LinearLayout(c);
                  l.setOrientation(LinearLayout.VERTICAL);
                  int p = dp(c, 16);
                  l.setPadding(p, p, p, p);
                  return l;
              }

              static ScrollView scroll(Context c, View child) {
                  ScrollView s = new ScrollView(c);
                  s.setBackgroundColor(BG);
                  s.addView(child);
                  return s;
              }

              static boolean isLight(int col) {
                  return (Color.red(col) * 299 + Color.green(col) * 587 + Color.blue(col) * 114) / 1000 > 140;
              }
          }
          FILE_13_END
