name: Build ColorTap APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/build-colortap.yml"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Принять лицензии Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Создать проект
        run: |
          mkdir -p app
          cat > app/build.gradle <<'FILE_0_END'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mushka.colortap'
              compileSdk 34

              defaultConfig {
                  applicationId "com.mushka.colortap"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }
          FILE_0_END
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'FILE_1_END'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="Автокликер по цвету"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".ColorService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />

                  <service
                      android:name=".TapService"
                      android:exported="true"
                      android:label="Автокликер по цвету"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/tap_service" />
                  </service>
              </application>
          </manifest>
          FILE_1_END
          mkdir -p app/src/main/java/com/mushka/colortap
          cat > app/src/main/java/com/mushka/colortap/ColorService.java <<'FILE_2_END'
          package com.mushka.colortap;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ServiceInfo;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.PixelFormat;
          import android.graphics.Rect;
          import android.graphics.drawable.GradientDrawable;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.media.Image;
          import android.media.ImageReader;
          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.util.DisplayMetrics;
          import android.view.Display;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.nio.ByteBuffer;

          public class ColorService extends Service {
              private static final int STEP = 3;
              private static final int CELL = 48;

              private final Handler h = new Handler(Looper.getMainLooper());
              private WindowManager wm;
              private MediaProjection mp;
              private MediaProjection.Callback mpCallback;
              private VirtualDisplay vd;
              private ImageReader reader;
              private int cw;
              private int ch;
              private int dpi;
              private SharedPreferences prefs;

              private LinearLayout bar;
              private WindowManager.LayoutParams barLp;
              private View swatch;
              private TextView bGo;
              private TextView bReg;
              private View ovl;
              private PickView pv;

              private boolean running;
              private long lastTap;
              private int taps;
              private int[] lastPt;

              @Override
              public IBinder onBind(Intent in) {
                  return null;
              }

              @Override
              public int onStartCommand(Intent in, int flags, int startId) {
                  if (in == null || "STOP".equals(in.getAction())) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  if (mp != null) {
                      return START_NOT_STICKY;
                  }
                  prefs = getSharedPreferences("c", MODE_PRIVATE);
                  startFg();
                  MediaProjectionManager m = (MediaProjectionManager) getSystemService(MEDIA_PROJECTION_SERVICE);
                  mp = m.getMediaProjection(in.getIntExtra("code", 0), (Intent) in.getParcelableExtra("data"));
                  if (mp == null) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  mpCallback = new MediaProjection.Callback() {
                      @Override
                      public void onStop() {
                          stopSelf();
                      }
                  };
                  mp.registerCallback(mpCallback, h);
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  makeDisplay();
                  showBar();
                  return START_NOT_STICKY;
              }

              private void startFg() {
                  NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  nm.createNotificationChannel(new NotificationChannel("c", "Автокликер", NotificationManager.IMPORTANCE_LOW));
                  Intent stop = new Intent(this, ColorService.class).setAction("STOP");
                  PendingIntent pi = PendingIntent.getService(this, 1, stop, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Notification n = new Notification.Builder(this, "c")
                          .setSmallIcon(android.R.drawable.ic_menu_search)
                          .setContentTitle("Автокликер по цвету работает")
                          .setContentText("Нажми «Остановить», чтобы выключить")
                          .addAction(new Notification.Action.Builder(android.R.drawable.ic_menu_close_clear_cancel, "Остановить", pi).build())
                          .setOngoing(true)
                          .build();
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION);
                  } else {
                      startForeground(1, n);
                  }
              }

              private DisplayMetrics realMetrics() {
                  DisplayMetrics dm = new DisplayMetrics();
                  DisplayManager dmg = (DisplayManager) getSystemService(Context.DISPLAY_SERVICE);
                  dmg.getDisplay(Display.DEFAULT_DISPLAY).getRealMetrics(dm);
                  return dm;
              }

              private void makeDisplay() {
                  DisplayMetrics dm = realMetrics();
                  cw = dm.widthPixels;
                  ch = dm.heightPixels;
                  dpi = dm.densityDpi;
                  reader = ImageReader.newInstance(cw, ch, PixelFormat.RGBA_8888, 2);
                  vd = mp.createVirtualDisplay("cap", cw, ch, dpi, DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                          reader.getSurface(), null, h);
              }

              // экран мог повернуться: подгоняем размер захвата
              private void fitDisplay() {
                  DisplayMetrics dm = realMetrics();
                  if (dm.widthPixels == cw && dm.heightPixels == ch) {
                      return;
                  }
                  cw = dm.widthPixels;
                  ch = dm.heightPixels;
                  ImageReader old = reader;
                  reader = ImageReader.newInstance(cw, ch, PixelFormat.RGBA_8888, 2);
                  vd.resize(cw, ch, dpi);
                  vd.setSurface(reader.getSurface());
                  old.close();
                  lastPt = null;
              }

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              private void toast(String s) {
                  Toast.makeText(this, s, Toast.LENGTH_SHORT).show();
              }

              private WindowManager.LayoutParams params(int w, int hh) {
                  WindowManager.LayoutParams lp = new WindowManager.LayoutParams(w, hh,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                  | WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT);
                  lp.gravity = Gravity.TOP | Gravity.START;
                  if (Build.VERSION.SDK_INT >= 30) {
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS;
                  } else if (Build.VERSION.SDK_INT >= 28) {
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  }
                  return lp;
              }

              // ---------- плавающая панель ----------
              private TextView btn(String text) {
                  TextView t = new TextView(this);
                  t.setText(text);
                  t.setTextColor(Color.WHITE);
                  t.setTextSize(14);
                  t.setPadding(dp(10), dp(8), dp(10), dp(8));
                  return t;
              }

              private void showBar() {
                  bar = new LinearLayout(this);
                  bar.setOrientation(LinearLayout.HORIZONTAL);
                  bar.setGravity(Gravity.CENTER_VERTICAL);
                  bar.setPadding(dp(6), dp(4), dp(6), dp(4));
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(0xEE171A2C);
                  g.setCornerRadius(dp(22));
                  g.setStroke(dp(1), 0x556C8CFF);
                  bar.setBackground(g);

                  TextView handle = btn("≡");
                  swatch = new View(this);
                  swatch.setLayoutParams(new LinearLayout.LayoutParams(dp(22), dp(22)));
                  TextView bPick = btn("Пипетка");
                  bReg = btn("Область");
                  bGo = btn("Старт");
                  TextView bX = btn("✕");
                  bar.addView(handle);
                  bar.addView(swatch);
                  bar.addView(bPick);
                  bar.addView(bReg);
                  bar.addView(bGo);
                  bar.addView(bX);

                  bPick.setOnClickListener(v -> startPick());
                  bReg.setOnClickListener(v -> startRegion());
                  bReg.setOnLongClickListener(v -> {
                      prefs.edit().putInt("rl", 0).putInt("rt", 0).putInt("rr", 0).putInt("rb", 0).apply();
                      toast("Поиск по всему экрану");
                      updateBar();
                      return true;
                  });
                  bGo.setOnClickListener(v -> toggle());
                  bX.setOnClickListener(v -> stopSelf());

                  barLp = params(WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT);
                  barLp.x = dp(12);
                  barLp.y = dp(80);
                  handle.setOnTouchListener(new View.OnTouchListener() {
                      float dx;
                      float dy;

                      @Override
                      public boolean onTouch(View v, MotionEvent e) {
                          switch (e.getAction()) {
                              case MotionEvent.ACTION_DOWN:
                                  dx = e.getRawX() - barLp.x;
                                  dy = e.getRawY() - barLp.y;
                                  return true;
                              case MotionEvent.ACTION_MOVE:
                                  barLp.x = (int) (e.getRawX() - dx);
                                  barLp.y = (int) (e.getRawY() - dy);
                                  wm.updateViewLayout(bar, barLp);
                                  return true;
                              default:
                                  return true;
                          }
                      }
                  });
                  wm.addView(bar, barLp);
                  updateBar();
              }

              private boolean hasRegion() {
                  return prefs.getInt("rr", 0) > prefs.getInt("rl", 0) && prefs.getInt("rb", 0) > prefs.getInt("rt", 0);
              }

              private void updateBar() {
                  bGo.setText(running ? "Стоп (" + taps + ")" : "Старт");
                  bReg.setText(hasRegion() ? "Область ✓" : "Область");
                  if (prefs.contains("color")) {
                      swatch.setBackgroundColor(prefs.getInt("color", 0) | 0xFF000000);
                  } else {
                      swatch.setBackgroundColor(0x44FFFFFF);
                  }
              }

              private void toggle() {
                  if (running) {
                      running = false;
                      h.removeCallbacks(scan);
                  } else {
                      if (!prefs.contains("color")) {
                          toast("Сначала выбери цвет пипеткой");
                          return;
                      }
                      if (TapService.inst == null) {
                          toast("Включи службу доступности «Автокликер по цвету»");
                          return;
                      }
                      running = true;
                      lastPt = null;
                      lastTap = 0;
                      taps = 0;
                      h.post(scan);
                  }
                  updateBar();
              }

              // ---------- слежение за цветом ----------
              private final Runnable scan = new Runnable() {
                  @Override
                  public void run() {
                      if (!running) {
                          return;
                      }
                      try {
                          doScan();
                      } catch (Exception ignored) {
                      }
                      h.postDelayed(this, Math.max(30, prefs.getInt("iv", 150)));
                  }
              };

              private void doScan() {
                  if (ovl != null) {
                      return;
                  }
                  fitDisplay();
                  Image img = reader.acquireLatestImage();
                  if (img != null) {
                      try {
                          lastPt = find(img);
                      } finally {
                          img.close();
                      }
                  }
                  long now = android.os.SystemClock.uptimeMillis();
                  if (lastPt != null && now - lastTap >= prefs.getInt("cd", 600)) {
                      if (TapService.tap(lastPt[0], lastPt[1])) {
                          lastTap = now;
                          taps++;
                          updateBar();
                      }
                  }
              }

              private int[] find(Image img) {
                  Image.Plane pl = img.getPlanes()[0];
                  ByteBuffer b = pl.getBuffer();
                  int ps = pl.getPixelStride();
                  int rs = pl.getRowStride();
                  int w = img.getWidth();
                  int hh = img.getHeight();
                  int col = prefs.getInt("color", 0);
                  int tr = Color.red(col);
                  int tg = Color.green(col);
                  int tb = Color.blue(col);
                  int tol = prefs.getInt("tol", 25);

                  int x0 = 0;
                  int y0 = 0;
                  int x1 = w;
                  int y1 = hh;
                  if (hasRegion()) {
                      x0 = Math.max(0, prefs.getInt("rl", 0));
                      y0 = Math.max(0, prefs.getInt("rt", 0));
                      x1 = Math.min(w, prefs.getInt("rr", w));
                      y1 = Math.min(hh, prefs.getInt("rb", hh));
                  }
                  Rect ex = new Rect(barLp.x - dp(4), barLp.y - dp(4), barLp.x + bar.getWidth() + dp(4), barLp.y + bar.getHeight() + dp(4));

                  int cols = (w + CELL - 1) / CELL;
                  int rows = (hh + CELL - 1) / CELL;
                  int[] cnt = new int[cols * rows];
                  long[] sx = new long[cols * rows];
                  long[] sy = new long[cols * rows];
                  for (int y = y0; y < y1; y += STEP) {
                      for (int x = x0; x < x1; x += STEP) {
                          if (ex.contains(x, y)) {
                              continue;
                          }
                          int o = y * rs + x * ps;
                          int r = b.get(o) & 0xFF;
                          int g = b.get(o + 1) & 0xFF;
                          int bl = b.get(o + 2) & 0xFF;
                          if (Math.abs(r - tr) <= tol && Math.abs(g - tg) <= tol && Math.abs(bl - tb) <= tol) {
                              int c = (y / CELL) * cols + (x / CELL);
                              cnt[c]++;
                              sx[c] += x;
                              sy[c] += y;
                          }
                      }
                  }
                  int best = -1;
                  int bestN = 2;
                  for (int i = 0; i < cnt.length; i++) {
                      if (cnt[i] > bestN) {
                          bestN = cnt[i];
                          best = i;
                      }
                  }
                  if (best < 0) {
                      return null;
                  }
                  return new int[]{(int) (sx[best] / cnt[best]), (int) (sy[best] / cnt[best])};
              }

              // ---------- пипетка ----------
              private void startPick() {
                  if (ovl != null) {
                      return;
                  }
                  bar.setVisibility(View.INVISIBLE);
                  ovl = new View(this);
                  h.postDelayed(() -> grabForPick(0), 250);
              }

              private void grabForPick(final int n) {
                  try {
                      fitDisplay();
                  } catch (Exception ignored) {
                  }
                  Image img = reader.acquireLatestImage();
                  if (img == null) {
                      if (n < 12) {
                          h.postDelayed(() -> grabForPick(n + 1), 120);
                      } else {
                          ovl = null;
                          bar.setVisibility(View.VISIBLE);
                          toast("Не удалось сделать снимок экрана");
                      }
                      return;
                  }
                  Bitmap shot;
                  try {
                      Image.Plane pl = img.getPlanes()[0];
                      Bitmap full = Bitmap.createBitmap(pl.getRowStride() / pl.getPixelStride(), img.getHeight(), Bitmap.Config.ARGB_8888);
                      full.copyPixelsFromBuffer(pl.getBuffer());
                      shot = Bitmap.createBitmap(full, 0, 0, img.getWidth(), img.getHeight());
                      if (shot != full) {
                          full.recycle();
                      }
                  } finally {
                      img.close();
                  }
                  pv = new PickView(this, shot);
                  ovl = pv;
                  wm.addView(pv, params(WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT));
              }

              private void finishPick(boolean ok) {
                  int col = 0;
                  if (ok) {
                      col = pv.pix((int) pv.px, (int) pv.py) | 0xFF000000;
                  }
                  wm.removeView(pv);
                  pv.shot.recycle();
                  pv = null;
                  ovl = null;
                  bar.setVisibility(View.VISIBLE);
                  if (ok) {
                      prefs.edit().putInt("color", col).apply();
                      toast(String.format("Цвет выбран: #%06X", col & 0xFFFFFF));
                  }
                  updateBar();
              }

              private class PickView extends View {
                  final Bitmap shot;
                  final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  float px;
                  float py;
                  boolean has;

                  PickView(Context c, Bitmap s) {
                      super(c);
                      shot = s;
                      p.setTextSize(dp(15));
                  }

                  int pix(int x, int y) {
                      x = Math.max(0, Math.min(shot.getWidth() - 1, x));
                      y = Math.max(0, Math.min(shot.getHeight() - 1, y));
                      return shot.getPixel(x, y);
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      int[] o = new int[2];
                      getLocationOnScreen(o);
                      c.drawBitmap(shot, -o[0], -o[1], null);
                      int w = getWidth();
                      int hh = getHeight();
                      int bh = dp(64);
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(0xAA000000);
                      c.drawRect(0, 0, w, dp(40), p);
                      p.setColor(Color.WHITE);
                      c.drawText("Проведи пальцем по нужному цвету", dp(12), dp(26), p);
                      p.setColor(0xEE171A2C);
                      c.drawRect(0, hh - bh, w, hh, p);
                      p.setColor(Color.WHITE);
                      c.drawText("Отмена", dp(24), hh - bh / 2f + dp(5), p);
                      if (!has) {
                          return;
                      }
                      float vx = px - o[0];
                      float vy = py - o[1];
                      int col = pix((int) px, (int) py) | 0xFF000000;
                      int cell = dp(9);
                      int n = 11;
                      int size = cell * n;
                      float lx = Math.max(dp(8), Math.min(w - size - dp(8), vx - size / 2f));
                      float ly = vy - dp(44) - size;
                      if (ly < dp(48)) {
                          ly = vy + dp(44);
                      }
                      for (int i = 0; i < n; i++) {
                          for (int j = 0; j < n; j++) {
                              p.setStyle(Paint.Style.FILL);
                              p.setColor(pix((int) px + i - 5, (int) py + j - 5) | 0xFF000000);
                              c.drawRect(lx + i * cell, ly + j * cell, lx + (i + 1) * cell, ly + (j + 1) * cell, p);
                          }
                      }
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(dp(2));
                      p.setColor(Color.WHITE);
                      c.drawRect(lx, ly, lx + size, ly + size, p);
                      p.setColor(Color.BLACK);
                      c.drawRect(lx + 5 * cell, ly + 5 * cell, lx + 6 * cell, ly + 6 * cell, p);
                      p.setColor(Color.WHITE);
                      c.drawCircle(vx, vy, dp(14), p);
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(col);
                      c.drawRect(w / 2f, hh - bh, w, hh, p);
                      boolean light = (Color.red(col) * 299 + Color.green(col) * 587 + Color.blue(col) * 114) / 1000 > 140;
                      p.setColor(light ? Color.BLACK : Color.WHITE);
                      c.drawText(String.format("Выбрать #%06X", col & 0xFFFFFF), w / 2f + dp(16), hh - bh / 2f + dp(5), p);
                  }

                  @Override
                  public boolean onTouchEvent(MotionEvent e) {
                      float rx = e.getRawX();
                      float ry = e.getRawY();
                      boolean inBtn = ry > ch - dp(64);
                      switch (e.getAction()) {
                          case MotionEvent.ACTION_DOWN:
                          case MotionEvent.ACTION_MOVE:
                              if (!inBtn) {
                                  px = rx;
                                  py = ry;
                                  has = true;
                                  invalidate();
                              }
                              return true;
                          case MotionEvent.ACTION_UP:
                              if (inBtn) {
                                  if (rx < cw / 2f) {
                                      finishPick(false);
                                  } else if (has) {
                                      finishPick(true);
                                  }
                              }
                              return true;
                          default:
                              return true;
                      }
                  }
              }

              // ---------- область поиска ----------
              private void startRegion() {
                  if (ovl != null) {
                      return;
                  }
                  bar.setVisibility(View.INVISIBLE);
                  ovl = new RegView(this);
                  wm.addView(ovl, params(WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT));
              }

              private void endRegion(Rect rc) {
                  wm.removeView(ovl);
                  ovl = null;
                  bar.setVisibility(View.VISIBLE);
                  if (rc.width() >= dp(24) && rc.height() >= dp(24)) {
                      prefs.edit().putInt("rl", rc.left).putInt("rt", rc.top).putInt("rr", rc.right).putInt("rb", rc.bottom).apply();
                      toast("Область сохранена");
                  }
                  updateBar();
              }

              private class RegView extends View {
                  final Paint dim = new Paint();
                  final Paint line = new Paint();
                  final Paint txt = new Paint();
                  float x0;
                  float y0;
                  float x1;
                  float y1;
                  boolean has;

                  RegView(Context c) {
                      super(c);
                      dim.setColor(0x88000000);
                      line.setColor(0xFF6C8CFF);
                      line.setStyle(Paint.Style.STROKE);
                      line.setStrokeWidth(dp(2));
                      txt.setColor(Color.WHITE);
                      txt.setTextSize(dp(16));
                      txt.setAntiAlias(true);
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      int[] o = new int[2];
                      getLocationOnScreen(o);
                      int w = getWidth();
                      int hh = getHeight();
                      if (!has) {
                          c.drawRect(0, 0, w, hh, dim);
                          c.drawText("Выдели область, где искать цвет", dp(24), dp(80), txt);
                          return;
                      }
                      float l = Math.min(x0, x1) - o[0];
                      float r = Math.max(x0, x1) - o[0];
                      float t = Math.min(y0, y1) - o[1];
                      float b = Math.max(y0, y1) - o[1];
                      c.drawRect(0, 0, w, t, dim);
                      c.drawRect(0, b, w, hh, dim);
                      c.drawRect(0, t, l, b, dim);
                      c.drawRect(r, t, w, b, dim);
                      c.drawRect(l, t, r, b, line);
                  }

                  @Override
                  public boolean onTouchEvent(MotionEvent e) {
                      switch (e.getAction()) {
                          case MotionEvent.ACTION_DOWN:
                              x0 = e.getRawX();
                              x1 = x0;
                              y0 = e.getRawY();
                              y1 = y0;
                              has = true;
                              invalidate();
                              return true;
                          case MotionEvent.ACTION_MOVE:
                              x1 = e.getRawX();
                              y1 = e.getRawY();
                              invalidate();
                              return true;
                          case MotionEvent.ACTION_UP:
                              x1 = e.getRawX();
                              y1 = e.getRawY();
                              endRegion(new Rect((int) Math.min(x0, x1), (int) Math.min(y0, y1),
                                      (int) Math.max(x0, x1), (int) Math.max(y0, y1)));
                              return true;
                          default:
                              return true;
                      }
                  }
              }

              @Override
              public void onDestroy() {
                  running = false;
                  h.removeCallbacksAndMessages(null);
                  try {
                      if (ovl != null && ovl.getParent() != null) {
                          wm.removeView(ovl);
                      }
                  } catch (Exception ignored) {
                  }
                  try {
                      if (bar != null) {
                          wm.removeView(bar);
                      }
                  } catch (Exception ignored) {
                  }
                  if (vd != null) {
                      vd.release();
                  }
                  if (reader != null) {
                      reader.close();
                  }
                  if (mp != null) {
                      try {
                          mp.unregisterCallback(mpCallback);
                          mp.stop();
                      } catch (Exception ignored) {
                      }
                  }
                  super.onDestroy();
              }
          }
          FILE_2_END
          mkdir -p app/src/main/java/com/mushka/colortap
          cat > app/src/main/java/com/mushka/colortap/MainActivity.java <<'FILE_3_END'
          package com.mushka.colortap;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.media.projection.MediaProjectionManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private SharedPreferences prefs;
              private TextView status;
              private TextView colorLabel;
              private View swatch;
              private LinearLayout root;
              private boolean askedNotifications = false;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  prefs = getSharedPreferences("c", MODE_PRIVATE);
                  int pad = dp(20);

                  ScrollView sv = new ScrollView(this);
                  sv.setBackgroundColor(Color.parseColor("#0E1020"));
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(pad, pad * 2, pad, pad);
                  sv.addView(root);

                  root.addView(label("Автокликер по цвету", 26));
                  root.addView(label("Приложение следит за экраном и нажимает туда, где видит выбранный цвет. Цвет выбирается пипеткой прямо с экрана.", 15));

                  status = label("", 14);
                  root.addView(status);

                  Button acc = new Button(this);
                  acc.setText("1. Включить службу доступности");
                  acc.setOnClickListener(v -> startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)));
                  root.addView(acc);
                  root.addView(label("Если переключатель серый, открой «Настройки, Приложения, Автокликер по цвету», нажми ⋮ вверху и выбери «Разрешить ограниченные настройки».", 13));

                  colorLabel = label("", 15);
                  swatch = new View(this);
                  swatch.setLayoutParams(new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(28)));
                  root.addView(colorLabel);
                  root.addView(swatch);

                  addSeek("Допуск цвета (больше, значит менее строго)", "tol", 0, 80, 25);
                  addSeek("Проверять экран каждые, мс", "iv", 50, 1000, 150);
                  addSeek("Пауза между нажатиями, мс", "cd", 100, 3000, 600);

                  Button go = new Button(this);
                  go.setText("2. Запустить");
                  go.setOnClickListener(v -> start());
                  root.addView(go);

                  root.addView(label("После запуска появится плавающая панель. «Пипетка» замораживает экран, ты проводишь пальцем по нужному цвету и подтверждаешь. «Область» ограничивает поиск прямоугольником (долгое нажатие сбрасывает на весь экран). «Старт» включает слежение. Остановить можно крестиком или в уведомлении.", 14));
                  setContentView(sv);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  status.setText("Служба доступности: " + (TapService.inst != null ? "включена" : "выключена"));
                  if (prefs.contains("color")) {
                      int c = prefs.getInt("color", 0) | 0xFF000000;
                      swatch.setBackgroundColor(c);
                      colorLabel.setText(String.format("Выбранный цвет: #%06X", c & 0xFFFFFF));
                  } else {
                      swatch.setBackgroundColor(Color.TRANSPARENT);
                      colorLabel.setText("Цвет не выбран (выбери пипеткой после запуска)");
                  }
              }

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              private TextView label(String text, int size) {
                  TextView t = new TextView(this);
                  t.setText(text);
                  t.setTextSize(size);
                  t.setTextColor(Color.WHITE);
                  t.setPadding(0, size > 20 ? 0 : dp(8), 0, dp(8));
                  return t;
              }

              private void addSeek(final String title, final String key, final int min, int max, int def) {
                  final TextView t = label("", 14);
                  SeekBar sb = new SeekBar(this);
                  sb.setMax(max - min);
                  int cur = prefs.getInt(key, def);
                  sb.setProgress(cur - min);
                  t.setText(title + ": " + cur);
                  sb.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override
                      public void onProgressChanged(SeekBar s, int p, boolean fromUser) {
                          prefs.edit().putInt(key, p + min).apply();
                          t.setText(title + ": " + (p + min));
                      }

                      @Override
                      public void onStartTrackingTouch(SeekBar s) {
                      }

                      @Override
                      public void onStopTrackingTouch(SeekBar s) {
                      }
                  });
                  root.addView(t);
                  root.addView(sb);
              }

              private void start() {
                  if (TapService.inst == null) {
                      Toast.makeText(this, "Сначала включи службу доступности «Автокликер по цвету»", Toast.LENGTH_LONG).show();
                      startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                      return;
                  }
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "Разреши показ поверх других окон, вернись и нажми «Запустить» снова", Toast.LENGTH_LONG).show();
                      startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName())));
                      return;
                  }
                  if (Build.VERSION.SDK_INT >= 33 && !askedNotifications
                          && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      askedNotifications = true;
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 7);
                      return;
                  }
                  MediaProjectionManager m = (MediaProjectionManager) getSystemService(MEDIA_PROJECTION_SERVICE);
                  startActivityForResult(m.createScreenCaptureIntent(), 1);
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] results) {
                  super.onRequestPermissionsResult(code, perms, results);
                  start();
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req == 1 && res == RESULT_OK && data != null) {
                      Intent i = new Intent(this, ColorService.class);
                      i.putExtra("code", res);
                      i.putExtra("data", data);
                      startForegroundService(i);
                      moveTaskToBack(true);
                  }
              }
          }
          FILE_3_END
          mkdir -p app/src/main/java/com/mushka/colortap
          cat > app/src/main/java/com/mushka/colortap/TapService.java <<'FILE_4_END'
          package com.mushka.colortap;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.content.Intent;
          import android.graphics.Path;
          import android.view.accessibility.AccessibilityEvent;

          public class TapService extends AccessibilityService {
              static volatile TapService inst;

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  inst = this;
              }

              @Override
              public boolean onUnbind(Intent intent) {
                  inst = null;
                  return super.onUnbind(intent);
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
              }

              @Override
              public void onInterrupt() {
              }

              static boolean tap(float x, float y) {
                  TapService s = inst;
                  if (s == null) {
                      return false;
                  }
                  Path p = new Path();
                  p.moveTo(x, y);
                  GestureDescription.StrokeDescription st = new GestureDescription.StrokeDescription(p, 0, 40);
                  return s.dispatchGesture(new GestureDescription.Builder().addStroke(st).build(), null, null);
              }
          }
          FILE_4_END
